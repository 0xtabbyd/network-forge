let dgDrag=null;
function attachDiagramDrag(viewName){
  const svg=document.querySelector('#canvasWrap svg'); if(!svg) return;
  svg.addEventListener('mousedown',e=>{
    const g=e.target.closest('[data-drag]'); if(!g) return;
    const [px,py]=g.dataset.pos.split(',').map(Number);
    const r=svg.getBoundingClientRect();
    dgDrag={view:viewName,key:g.dataset.drag,
      dx:(e.clientX-r.left)/zoom-px, dy:(e.clientY-r.top)/zoom-py, moved:false};
    e.preventDefault(); e.stopPropagation();
  });
}
let _dgRaf=0;
window.addEventListener('mousemove',e=>{
  if(!dgDrag) return;
  const svg=document.querySelector('#canvasWrap svg'); if(!svg) return;
  const r=svg.getBoundingClientRect();
  dgDrag.pend={
    x:Math.max(0,(e.clientX-r.left)/zoom-dgDrag.dx),
    y:Math.max(0,(e.clientY-r.top)/zoom-dgDrag.dy)
  };
  dgDrag.moved=true;
  if(_dgRaf) return;
  _dgRaf=requestAnimationFrame(()=>{
    _dgRaf=0;
    if(!dgDrag||!dgDrag.pend) return;
    project.layout=project.layout||{};
    (project.layout[dgDrag.view]=project.layout[dgDrag.view]||{})[dgDrag.key]={...dgDrag.pend};
    renderView();
  });
});
window.addEventListener('mouseup',()=>{
  if(!dgDrag) return;
  if(_dgRaf){ cancelAnimationFrame(_dgRaf); _dgRaf=0; }
  if(dgDrag.moved&&dgDrag.pend){
    project.layout=project.layout||{};
    (project.layout[dgDrag.view]=project.layout[dgDrag.view]||{})[dgDrag.key]={
      x:Math.round(dgDrag.pend.x/10)*10, y:Math.round(dgDrag.pend.y/10)*10};
    dgDrag=null; renderView(); commit(); return;
  }
  dgDrag=null;
});
function applyLayoutOverride(viewName,pos){
  const ov=project.layout?.[viewName]||{};
  for(const k in ov){ if(pos[k]){ pos[k].x=ov[k].x; pos[k].y=ov[k].y; } }
}

// ═══════════════════════════════════════════════════════
// Cable drag engine (all views) — drag a cable to shift its mid route
// ═══════════════════════════════════════════════════════
let cbDrag=null;
function routeOff(view,key){
  const o=project.linkRoute?.[view]?.[key];
  return o?{dx:o.dx||0,dy:o.dy||0}:{dx:0,dy:0};
}
function attachCableDrag(viewName){
  const svg=document.querySelector('#canvasWrap svg'); if(!svg) return;
  svg.addEventListener('mousedown',e=>{
    const el=e.target.closest('[data-cable]'); if(!el) return;
    const key=el.dataset.cable;
    const r=svg.getBoundingClientRect();
    const cur=routeOff(viewName,key);
    cbDrag={view:viewName,key,
      sx:(e.clientX-r.left)/zoom, sy:(e.clientY-r.top)/zoom,
      ox:cur.dx, oy:cur.dy, moved:false};
    e.preventDefault(); e.stopPropagation();
  });
}
// ドラッグ中は requestAnimationFrame で再描画をまとめ、スナップも掛けない（追従をなめらかに）
let _cbRaf=0;
window.addEventListener('mousemove',e=>{
  if(!cbDrag) return;
  const svg=document.querySelector('#canvasWrap svg'); if(!svg) return;
  const r=svg.getBoundingClientRect();
  cbDrag.pend={
    dx:(e.clientX-r.left)/zoom-cbDrag.sx+cbDrag.ox,
    dy:(e.clientY-r.top)/zoom-cbDrag.sy+cbDrag.oy
  };
  cbDrag.moved=true;
  if(_cbRaf) return;                      // 1フレームに1回だけ描画
  _cbRaf=requestAnimationFrame(()=>{
    _cbRaf=0;
    if(!cbDrag||!cbDrag.pend) return;
    project.linkRoute=project.linkRoute||{};
    (project.linkRoute[cbDrag.view]=project.linkRoute[cbDrag.view]||{})[cbDrag.key]={...cbDrag.pend};
    renderView();
  });
});
window.addEventListener('mouseup',()=>{
  if(!cbDrag) return;
  if(_cbRaf){ cancelAnimationFrame(_cbRaf); _cbRaf=0; }
  if(cbDrag.moved&&cbDrag.pend){
    // 離した瞬間だけグリッドに整える
    project.linkRoute=project.linkRoute||{};
    (project.linkRoute[cbDrag.view]=project.linkRoute[cbDrag.view]||{})[cbDrag.key]={
      dx:Math.round(cbDrag.pend.dx/5)*5, dy:Math.round(cbDrag.pend.dy/5)*5};
    cbDrag=null; renderView(); commit(); return;
  }
  cbDrag=null;
});
// ── Cable hover highlight: hovered cable cloned into a top overlay layer ──
function attachCableHover(){
  const svg=document.querySelector('#canvasWrap svg'); if(!svg) return;
  // dedicated overlay layer, always last child = always on top
  let layer=svg.querySelector('#hlLayer');
  if(!layer){
    layer=document.createElementNS(NS_SVG,'g');
    layer.setAttribute('id','hlLayer');
    svg.appendChild(layer);
  }
  const clear=()=>{
    svg.classList.remove('hl-on');
    svg.querySelectorAll('g.dev-g.hl').forEach(e=>e.classList.remove('hl'));
    while(layer.firstChild) layer.removeChild(layer.firstChild);
  };
  const addTag=(x,y,txt,anchorRight)=>{
    const fit=fitLabel(txt,260,10.5,8,'600');
    const w=textWidth(fit.text,fit.size,'600')+14, h=18;
    const bx=anchorRight?x-w-11:x+11, by=y-h/2;
    const bg=document.createElementNS(NS_SVG,'rect');
    bg.setAttribute('x',bx);bg.setAttribute('y',by);bg.setAttribute('width',w);bg.setAttribute('height',h);
    bg.setAttribute('rx','5');bg.setAttribute('fill','#0F172A');bg.setAttribute('opacity','.95');
    bg.setAttribute('stroke','#F59E0B');bg.setAttribute('stroke-width','1');
    const tx=document.createElementNS(NS_SVG,'text');
    tx.setAttribute('x',bx+7);tx.setAttribute('y',by+h/2+3.6);
    tx.setAttribute('font-size',fit.size);tx.setAttribute('fill','#F8FAFC');tx.setAttribute('font-weight','600');
    tx.textContent=fit.text;
    layer.appendChild(bg);layer.appendChild(tx);
  };
  svg.addEventListener('mouseover',e=>{
    const path=e.target.closest('[data-cable]');
    if(!path||cbDrag||drag||dgDrag) return;
    const key=path.dataset.cable;
    clear();
    svg.classList.add('hl-on');
    // clone every stroke of this cable into overlay (trunk = multiple bands)
    const strokes=[...svg.querySelectorAll(`[data-cable="${CSS.escape(key)}"]`)];
    for(const src of strokes){
      const halo=src.cloneNode(false);
      halo.removeAttribute('data-cable');halo.removeAttribute('data-link');
      halo.setAttribute('stroke','#FFFFFF');halo.setAttribute('stroke-width','7.5');
      halo.setAttribute('opacity','.9');halo.removeAttribute('stroke-dasharray');
      const cp=src.cloneNode(false);
      cp.removeAttribute('data-cable');cp.removeAttribute('data-link');
      cp.setAttribute('stroke-width','3.6');cp.setAttribute('opacity','1');
      layer.appendChild(halo);layer.appendChild(cp);
    }
    const link=(project.links||[]).find(l=>l.id===key);
    if(link){
      for(const dn of [link.a.deviceId,link.b.deviceId])
        svg.querySelector(`g.dev-g[data-dev="${CSS.escape(dn)}"]`)?.classList.add('hl');
      const base=strokes[0];
      let p0,p1;
      try{ p0=base.getPointAtLength(0); p1=base.getPointAtLength(base.getTotalLength()); }catch(err){ return; }
      const ends=[[link.a,p0],[link.b,p1]];
      for(const [end,pt] of ends){
        const dev=project.devices.find(x=>x.id===end.deviceId);
        const iface=(dev?.interfaces||[]).find(i=>i.id===end.ifId);
        const ring=document.createElementNS(NS_SVG,'circle');
        ring.setAttribute('cx',pt.x);ring.setAttribute('cy',pt.y);ring.setAttribute('r','8');
        ring.setAttribute('fill','none');ring.setAttribute('stroke','#F59E0B');ring.setAttribute('stroke-width','2.6');
        layer.appendChild(ring);
        const info=[iface?.name||end.ifId,
          iface?.ip?`${iface.ip}/${iface.prefix??''}`:null,
          iface?.vlanId!=null?`VLAN${iface.vlanId}`:null,
          (iface?.allowedVlans||[]).length?`Trunk[${iface.allowedVlans.join(',')}]`:null
        ].filter(Boolean).join('  ');
        addTag(pt.x,pt.y,`${dev?.name||''}  ${info}`, pt.x>(+svg.getAttribute('width')||1200)*0.72);
      }
    }
  });
  svg.addEventListener('mouseout',e=>{
    if(!e.target.closest('[data-cable]')) return;
    const to=e.relatedTarget;
    if(to&&to.closest&&to.closest('[data-cable]')) return;
    clear();
  });
}

// orthogonal joint helper: inserts an elbow between a→b if not axis-aligned
function joint(a,b,horizFirst){
  if(Math.abs(a[0]-b[0])<0.1||Math.abs(a[1]-b[1])<0.1) return [];
  return horizFirst?[[b[0],a[1]]]:[[a[0],b[1]]];
}

// ═══════════════════════════════════════════════════════
// Presentation: Hybrid View
// ═══════════════════════════════════════════════════════
function renderHybrid(){
  const wrap=document.getElementById('canvasWrap');
  wrap.classList.add('diagram');
  const G=buildGraph(project);
  const level=bfsLevels(project,G);
  const byLv={};
  for(const d of project.devices)(byLv[level[d.id]]=byLv[level[d.id]]||[]).push(d);
  const netKeyOf=d=>{
    const i=(d.interfaces||[]).find(x=>x.ip&&x.role!=='wan');
    if(i) return netOf(i.ip,+(i.prefix??24));
    const a=(d.interfaces||[]).find(x=>x.vlanId!=null);
    return a?('vlan'+String(a.vlanId).padStart(4,'0')):'~';
  };
  const sizeFn=d=>({w:210,h:36+(d.interfaces?.length||0)*17+8});
  const keys=Object.keys(byLv).map(Number).sort((a,b)=>a-b);
  const GX=48,GY=100,W=1400;
  const pos={};let y=54;
  for(const k of keys){
    const row=byLv[k].slice().sort((a,b)=>netKeyOf(a)<netKeyOf(b)?-1:netKeyOf(a)>netKeyOf(b)?1:0);
    const sizes=row.map(sizeFn);
    const totW=sizes.reduce((s,z)=>s+z.w,0)+(row.length-1)*GX;
    let x=Math.max(26,(W-totW)/2),maxH=0;
    row.forEach((d,i)=>{pos[d.id]={x,y,...sizes[i]};x+=sizes[i].w+GX;maxH=Math.max(maxH,sizes[i].h);});
    y+=maxH+GY;
  }
  applyLayoutOverride('hybrid',pos);
  let CW=1400,CH=y+30;
  for(const k in pos){CW=Math.max(CW,pos[k].x+pos[k].w+40);CH=Math.max(CH,pos[k].y+pos[k].h+60);}
  const p=[];
  p.push(`<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" width="${CW}" height="${CH}" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="xMinYMin meet">`);
  p.push(`<rect width="${CW}" height="${CH}" fill="#F8FAFC"/>`);
  // Subnet frames
  for(const net of G.nets.values()){
    if(net.type!=='lan') continue;
    const memberIds=[...new Set(net.interfaces.map(m=>m.deviceId))]
      .filter(id=>{const d=G.devMap[id];return d&&deviceNets(d).length===1&&pos[id];});
    if(memberIds.length===0) continue;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const id of memberIds){const z=pos[id];
      x0=Math.min(x0,z.x);y0=Math.min(y0,z.y);x1=Math.max(x1,z.x+z.w);y1=Math.max(y1,z.y+z.h);}
    const P=14;
    const gwIp=(()=>{for(const m of net.interfaces){const i=G.ifOf(m.deviceId,m.ifId);
      if(i?.role==='svi') return i.ip;}
      for(const id of memberIds){const d=G.devMap[id];
        for(const i of d.interfaces||[]) if(i.gateway&&inNet(i.gateway,net.cidr)) return i.gateway;}
      return null;})();
    p.push(`<rect x="${x0-P}" y="${y0-P-16}" width="${x1-x0+P*2}" height="${y1-y0+P*2+16}" rx="12"
      fill="${net.color}" fill-opacity="0.06" stroke="${net.color}" stroke-width="1.5" stroke-dasharray="7,4"/>`);
    const lbl=`${net.cidr}${net.vlan!=null?'  VLAN'+net.vlan:''}${gwIp?'  GW '+gwIp:''}`;
    p.push(`<rect x="${x0-P+6}" y="${y0-P-24}" width="${lbl.length*6.4+14}" height="16" rx="4" fill="${net.color}"/>`);
    p.push(`<text x="${x0-P+13}" y="${y0-P-12.5}" font-size="9.5" fill="white" font-weight="700" font-family="'SF Mono',Menlo,monospace">${esc(lbl)}</text>`);
  }
  const portPt2=(devId,ifId,side)=>{
    const z=pos[devId];const d=G.devMap[devId];
    const idx=(d?.interfaces||[]).findIndex(i=>i.id===ifId);
    if(!z||idx<0) return null;
    return {x:side==='l'?z.x:z.x+z.w,y:z.y+36+idx*17+8};
  };
  const ifNetColor=i=>{
    if(!i) return null;
    if(i.ip&&i.prefix!=null){const n=G.nets.get(netOf(i.ip,+i.prefix));if(n)return n.color;}
    if(i.vlanId!=null){for(const n of G.nets.values())if(n.vlan===i.vlanId)return n.color;}
    return null;
  };
  const vlanColor=v=>{for(const n of G.nets.values())if(n.vlan===v)return n.color;return '#94A3B8';};
  const hbBoxes=project.devices.filter(d=>pos[d.id]).map(d=>({id:d.id,x:pos[d.id].x,y:pos[d.id].y,w:pos[d.id].w,h:pos[d.id].h}));
  for(const l of project.links||[]){
    const za=pos[l.a.deviceId],zb=pos[l.b.deviceId];
    if(!za||!zb) continue;
    const aLeft=za.x+za.w/2>zb.x+zb.w/2;
    const pa=portPt2(l.a.deviceId,l.a.ifId,aLeft?'l':'r');
    const pb=portPt2(l.b.deviceId,l.b.ifId,aLeft?'r':'l');
    if(!pa||!pb) continue;
    const ia=G.ifOf(l.a.deviceId,l.a.ifId),ib=G.ifOf(l.b.deviceId,l.b.ifId);
    const wl=l.type==='wireless';
    const trunkVlans=(ia?.allowedVlans?.length?ia.allowedVlans:ib?.allowedVlans)||[];
    const color=ifNetColor(ia)||ifNetColor(ib)||'#64748B';
    const ext=24;
    const roff=routeOff('hybrid',l.id);
    const ax=(aLeft?pa.x-ext:pa.x+ext)+roff.dx, bx=(aLeft?pb.x+ext:pb.x-ext)+roff.dx;
    const my=(pa.y+pb.y)/2+roff.dy;
    // 障害物回避を適用したベース経路（手動オフセット後も継続）
    const basePts=avoidBoxes([[pa.x,pa.y],[ax,pa.y],[ax,my],[bx,my],[bx,pb.y],[pb.x,pb.y]],
                             hbBoxes.filter(b=>b.id!==l.a.deviceId&&b.id!==l.b.deviceId));
    const mkPath=o=>'M'+basePts.map(([qx,qy])=>`${qx},${qy+o}`).join(' L');
    if(trunkVlans.length>0){
      const spread=(trunkVlans.length-1)*4;
      p.push(`<path d="${mkPath(0)}" fill="none" stroke="white" stroke-width="${spread+9}" stroke-linejoin="round"/>`);
      trunkVlans.forEach((v,vi)=>{
        const off=(vi-(trunkVlans.length-1)/2)*4;
        p.push(`<path d="${mkPath(off)}" data-cable="${esc(l.id)}" fill="none" stroke="${vlanColor(v)}" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/>`);
      });
      const lbl='Trunk: VLAN '+trunkVlans.join(', ');
      const mp=pointAtFraction(basePts,0.5);
      const fit=fitLabel(lbl,150,8,6.5,'700');
      const lw=textWidth(fit.text,fit.size,'700')+11, lh=12.5;
      const lx=mp.vertical?mp.x+8:mp.x-lw/2, ly=mp.vertical?mp.y-lh/2:mp.y-lh-4;
      p.push(`<rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="3" fill="white" stroke="#CBD5E1" stroke-width=".8"/>`);
      p.push(`<text x="${lx+lw/2}" y="${ly+lh-3.6}" font-size="${fit.size}" fill="#475569" font-weight="700" text-anchor="middle">${esc(fit.text)}</text>`);
    } else {
      const d=mkPath(0);
      p.push(`<path d="${d}" fill="none" stroke="white" stroke-width="6.5" stroke-linejoin="round"/>`);
      p.push(`<path d="${d}" data-cable="${esc(l.id)}" fill="none" stroke="${color}" stroke-width="2.2" ${wl?'stroke-dasharray="6,4"':''} stroke-linejoin="round" opacity=".92"/>`);
      if(l.speed){
        const mp=pointAtFraction(basePts,0.5);
        const dEnd=Math.min(Math.hypot(mp.x-pa.x,mp.y-pa.y),Math.hypot(mp.x-pb.x,mp.y-pb.y));
        if(dEnd>=30){
          const fit=fitLabel(String(l.speed),56,8,6.5,'600');
          const lw=textWidth(fit.text,fit.size,'600')+9, lh=11.5;
          const lx=mp.vertical?mp.x+7:mp.x-lw/2, ly=mp.vertical?mp.y-lh/2:mp.y-lh-3;
          p.push(`<rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="3" fill="white" fill-opacity=".92"/>`);
          p.push(`<text x="${lx+lw/2}" y="${ly+lh-3.2}" font-size="${fit.size}" fill="${color}" font-weight="600" text-anchor="middle">${esc(fit.text)}</text>`);
        }
      }
    }
  }
  for(const d of project.devices){
    const z=pos[d.id];if(!z)continue;
    const s=DEV_TYPES[d.type]||DEV_TYPES.pc;
    p.push(`<g class="dev-g" data-drag="${esc(d.id)}" data-pos="${z.x},${z.y}">`);
    p.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="9" fill="white" stroke="${s.border}" stroke-width="2"/>`);
    p.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="24" rx="9" fill="${s.bg}"/>`);
    p.push(`<rect x="${z.x}" y="${z.y+14}" width="${z.w}" height="10" fill="${s.bg}"/>`);
    p.push(`<line x1="${z.x}" y1="${z.y+24}" x2="${z.x+z.w}" y2="${z.y+24}" stroke="${s.border}" stroke-width="1"/>`);
    p.push(`<rect x="${z.x+6}" y="${z.y+5}" width="30" height="14" rx="4" fill="${s.border}"/>`);
    p.push(`<text x="${z.x+21}" y="${z.y+15}" font-size="8" fill="white" font-weight="700" text-anchor="middle">${s.tag}</text>`);
    p.push(devIcon(d.type, z.x+40, z.y+5, 14, s.border));
    p.push(`<text x="${z.x+58}" y="${z.y+16}" font-size="10.5" fill="#1E293B" font-weight="700">${esc(fitText(d.name,z.w-66,10.5))}</text>`);
    (d.interfaces||[]).forEach((i,idx)=>{
      const ry=z.y+36+idx*17+8;
      const nc=ifNetColor(i);
      const linked=(project.links||[]).some(l=>
        (l.a.deviceId===d.id&&l.a.ifId===i.id)||(l.b.deviceId===d.id&&l.b.ifId===i.id));
      if(i.role!=='svi'){
        p.push(`<circle cx="${z.x}" cy="${ry}" r="3.8" fill="${linked?(nc||'#16A34A'):'#E2E8F0'}" stroke="white" stroke-width="1.2"/>`);
        p.push(`<circle cx="${z.x+z.w}" cy="${ry}" r="3.8" fill="${linked?(nc||'#16A34A'):'#E2E8F0'}" stroke="white" stroke-width="1.2"/>`);
      }
      // measured, right-boundary aware layout
      const RIGHT=z.x+z.w-(i.role==='svi'?22:8);
      let tx=z.x+9;
      const nm2=fitText(i.name,62,8.5);
      p.push(`<text x="${tx}" y="${ry+3}" font-size="8.5" fill="#0F172A" font-weight="${i.role==='svi'?'700':'600'}">${esc(nm2)}</text>`);
      tx+=textWidth(nm2,8.5,'600')+6;
      if(i.ip){
        const iptxt=`${i.ip}/${i.prefix??''}`;
        const w=textWidth(iptxt,8.5,'600');
        if(tx+w<=RIGHT){
          p.push(`<text x="${tx}" y="${ry+3}" font-size="8.5" fill="${nc||'#0369A1'}" font-family="'SF Mono',Menlo,monospace" font-weight="600">${esc(iptxt)}</text>`);
          tx+=w+6;
        }
      }
      if(i.vlanId!=null){
        const lbl='VLAN '+i.vlanId, w=textWidth(lbl,7.5,'700')+8;
        if(tx+w<=RIGHT){
          p.push(`<rect x="${tx}" y="${ry-6}" width="${w}" height="11" rx="3" fill="${vlanColor(i.vlanId)}"/>`);
          p.push(`<text x="${tx+w/2}" y="${ry+2.5}" font-size="7.5" fill="white" font-weight="700" text-anchor="middle">${lbl}</text>`);
          tx+=w+5;
        }
      }
      if((i.allowedVlans||[]).length){
        const lbl=`Trunk ${i.allowedVlans.join(',')}`, w=textWidth(lbl,7.5,'700');
        if(tx+w<=RIGHT){
          p.push(`<text x="${tx}" y="${ry+3}" font-size="7.5" fill="#7C3AED" font-weight="700">${esc(lbl)}</text>`);
          tx+=w+6;
        }
      }
      if(i.gateway){
        const lbl='GW '+i.gateway, w=textWidth(lbl,7.5,'400');
        if(tx+w<=RIGHT) p.push(`<text x="${tx}" y="${ry+3}" font-size="7.5" fill="#94A3B8">${esc(lbl)}</text>`);
      }
      if(i.role==='svi'&&nc){
        p.push(`<circle cx="${z.x+z.w-11}" cy="${ry}" r="5" fill="${nc}" stroke="white" stroke-width="1.3" stroke-dasharray="2,1.5"/>`);
        p.push(`<text x="${z.x+z.w-11}" y="${ry+2.5}" font-size="6.5" fill="white" font-weight="700" text-anchor="middle">.${esc(String(i.ip||'').split('.').pop())}</text>`);
      }
    });
    p.push('</g>');
  }
  p.push('</svg>');
  wrap.innerHTML=p.join('');
  applyZoom();
  attachDiagramDrag('hybrid');
  attachCableDrag('hybrid');
  attachCableHover();
}

// Presentation: Logical View
// ═══════════════════════════════════════════════════════
function renderLogical(){
  const wrap=document.getElementById('canvasWrap');
  wrap.classList.add('diagram');
  const G=buildGraph(project);
  const nodes=[];const nodeIdx={};
  const addNode=n=>{nodeIdx[n.key]=nodes.length;nodes.push(n);};
  for(const d of project.devices){
    if(deviceNets(d).length>0||d.type==='internet') addNode({key:'d:'+d.id,kind:'dev',dev:d});
  }
  for(const n of G.nets.values()) addNode({key:'n:'+n.cidr,kind:'net',net:n});
  const adj={};nodes.forEach(n=>adj[n.key]=[]);
  for(const n of G.nets.values()) for(const m of n.interfaces){
    const dk='d:'+m.deviceId,nk='n:'+n.cidr;
    if(nodeIdx[dk]!=null){adj[dk].push(nk);adj[nk].push(dk);}
  }
  const rootDev=project.devices.find(d=>d.type==='internet')||project.devices[0];
  const rootKey='d:'+(rootDev?.id);
  const level={};
  if(nodeIdx[rootKey]!=null){level[rootKey]=0;const q=[rootKey];
    while(q.length){const c=q.shift();for(const nb of adj[c])if(level[nb]===undefined){level[nb]=level[c]+1;q.push(nb);}}}
  let maxLv=0;for(const k in level)maxLv=Math.max(maxLv,level[k]);
  for(const n of nodes)if(level[n.key]===undefined)level[n.key]=++maxLv;
  const byLv={};
  for(const n of nodes)(byLv[level[n.key]]=byLv[level[n.key]]||[]).push(n);
  const keys=Object.keys(byLv).map(Number).sort((a,b)=>a-b);
  const W=1250,GX=40,GY=75;
  const pos={};let y=45;
  for(const k of keys){
    const row=byLv[k];
    const sizes=row.map(n=>n.kind==='dev'?{w:150,h:48}:{w:185,h:44});
    const totW=sizes.reduce((s,z)=>s+z.w,0)+(row.length-1)*GX;
    let x=Math.max(20,(W-totW)/2),maxH=0;
    row.forEach((n,i)=>{pos[n.key]={x,y,...sizes[i]};x+=sizes[i].w+GX;maxH=Math.max(maxH,sizes[i].h);});
    y+=maxH+GY;
  }
  applyLayoutOverride('logical',pos);
  let H=y+40, W2=Math.max(W,900);
  for(const k in pos){H=Math.max(H,pos[k].y+pos[k].h+50);W2=Math.max(W2,pos[k].x+pos[k].w+40);}
  const p=[];
  p.push(`<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" width="${W2}" height="${H}" viewBox="0 0 ${W2} ${H}" preserveAspectRatio="xMinYMin meet">`);
  p.push(`<rect width="${W2}" height="${H}" fill="#F5F3FF"/>`);
  for(const n of G.nets.values()){
    const nk='n:'+n.cidr,np=pos[nk];if(!np)continue;
    for(const m of n.interfaces){
      const dp=pos['d:'+m.deviceId];if(!dp)continue;
      const top=dp.y<np.y?dp:np,bot=dp.y<np.y?np:dp;
      const ckey=n.cidr+'|'+m.deviceId+'|'+m.ifId;
      const roff=routeOff('logical',ckey);
      const x1=top.x+top.w/2, y1=top.y+top.h, x2=bot.x+bot.w/2, y2=bot.y;
      let lpts;
      if(roff.dx){
        // dx あり: 中間に縦通しレーンを作るドッグレッグ（dx が横方向に効く）
        const mx=(x1+x2)/2+roff.dx;
        const q=Math.max(14,Math.abs(y2-y1)*0.28);
        const ya=y1+q+roff.dy, yb=y2-q+roff.dy;
        lpts=[[x1,y1],[x1,ya],[mx,ya],[mx,yb],[x2,yb],[x2,y2]];
      } else {
        const my=(y1+y2)/2+roff.dy;
        lpts=(Math.abs(x1-x2)<1&&!roff.dy)
          ? [[x1,y1],[x2,y2]]
          : [[x1,y1],[x1,my],[x2,my],[x2,y2]];
      }
      lpts=lpts.filter((q2,i)=>i===0||Math.abs(q2[0]-lpts[i-1][0])>0.1||Math.abs(q2[1]-lpts[i-1][1])>0.1);
      const d='M'+lpts.map(q2=>q2.join(',')).join(' L');
      p.push(`<path d="${d}" fill="none" stroke="white" stroke-width="6"/>`);
      p.push(`<path d="${d}" data-cable="${esc(ckey)}" fill="none" stroke="${n.color}" stroke-width="2.2" opacity=".85"/>`);
      const iface=G.ifOf(m.deviceId,m.ifId);
      if(iface?.ip){
        p.push(`<text x="${dp.x+dp.w/2+6}" y="${top===dp?dp.y+dp.h+13:dp.y-6}" font-size="8" fill="${n.color}" font-weight="600">.${iface.ip.split('.').pop()}</text>`);
      }
    }
  }
  for(const n of nodes){
    const z=pos[n.key];if(!z)continue;
    p.push(`<g class="dev-g" data-drag="${esc(n.key)}" data-pos="${z.x},${z.y}">`);
    if(n.kind==='dev'){
      const s=DEV_TYPES[n.dev.type]||DEV_TYPES.pc;
      p.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="8" fill="${s.bg}" stroke="${s.border}" stroke-width="2"/>`);
      p.push(`<rect x="${z.x+6}" y="${z.y+7}" width="30" height="14" rx="4" fill="${s.border}"/>`);
      p.push(`<text x="${z.x+21}" y="${z.y+17}" font-size="8" fill="white" font-weight="700" text-anchor="middle">${s.tag}</text>`);
      p.push(`<text x="${z.x+z.w/2}" y="${z.y+19}" font-size="10.5" fill="#1E293B" font-weight="600" text-anchor="middle">${esc(n.dev.name.length>13?n.dev.name.slice(0,12)+'…':n.dev.name)}</text>`);
      const svis=(n.dev.interfaces||[]).filter(i=>i.role==='svi');
      if(svis.length) p.push(`<text x="${z.x+z.w/2}" y="${z.y+36}" font-size="8" fill="#7C3AED" text-anchor="middle" font-weight="600">SVI: ${svis.map(i=>'VLAN '+i.vlanId).join(' / ')}</text>`);
      else if(n.dev.routes?.length) p.push(`<text x="${z.x+z.w/2}" y="${z.y+36}" font-size="8" fill="#94A3B8" text-anchor="middle">routes: ${n.dev.routes.length}</text>`);
    } else {
      const net=n.net;
      p.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="${z.h/2}" fill="white" stroke="${net.color}" stroke-width="2.5"/>`);
      p.push(`<text x="${z.x+z.w/2}" y="${z.y+19}" font-size="11" fill="#1E293B" font-weight="700" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">${esc(net.cidr)}</text>`);
      const sub=[net.type==='wan'?'WAN':'LAN',net.vlan!=null?('VLAN '+net.vlan):null].filter(Boolean).join(' / ');
      p.push(`<text x="${z.x+z.w/2}" y="${z.y+33}" font-size="8.5" fill="${net.color}" text-anchor="middle" font-weight="600">${esc(sub)}</text>`);
    }
    p.push('</g>');
  }
  p.push('</svg>');
  wrap.innerHTML=p.join('');
  applyZoom();
  attachDiagramDrag('logical');
  attachCableDrag('logical');
  attachCableHover();
}

function renderVlan(){
  const wrap=document.getElementById('canvasWrap');
  wrap.classList.remove('diagram');
  const G=buildGraph(project);
  const vlans=new Map();
  const touch=id=>{if(!vlans.has(id))vlans.set(id,{svi:[],access:[],trunk:[]});return vlans.get(id);};
  for(const d of project.devices) for(const i of d.interfaces||[]){
    if(i.role==='svi'&&i.vlanId!=null) touch(i.vlanId).svi.push(`${d.name} ${i.name} — ${i.ip??''}/${i.prefix??''}`);
    else if(i.vlanId!=null) touch(i.vlanId).access.push(`${d.name} / ${i.name}${i.ip?' — '+i.ip:''}`);
    for(const v of i.allowedVlans||[]) touch(v).trunk.push(`${d.name} / ${i.name}`);
  }
  const netByVlan={};
  for(const n of G.nets.values())if(n.vlan!=null)netByVlan[n.vlan]=n;
  const ids=[...vlans.keys()].sort((a,b)=>a-b);
  if(ids.length===0){wrap.innerHTML='<div class="tblwrap" style="color:var(--text2)"><h2 style="color:var(--text)">VLAN構成図</h2><p>VLANが定義されていません。</p></div>';return;}
  const h=['<div class="vlan-grid">'];
  for(const id of ids){
    const v=vlans.get(id);const net=netByVlan[id];
    const color=net?.color||'#64748B';
    h.push(`<div class="vlan-card"><div class="vh" style="background:${color}">VLAN ${id}${net?` <span style="font-weight:400;font-size:12px;opacity:.9">${esc(net.cidr)}</span>`:''}</div><div class="vb">`);
    if(v.svi.length){h.push('<div class="sec">SVI (Gateway)</div>');v.svi.forEach(m=>h.push(`<div class="mem">${esc(m)}</div>`));}
    if(v.access.length){h.push('<div class="sec">Access</div>');v.access.forEach(m=>h.push(`<div class="mem">${esc(m)}</div>`));}
    if(v.trunk.length){h.push('<div class="sec">Trunk経由</div>');v.trunk.forEach(m=>h.push(`<div class="mem">${esc(m)}</div>`));}
    h.push('</div></div>');
  }
  h.push('</div>');
  wrap.innerHTML=h.join('');
}
function renderPort(){
  const wrap=document.getElementById('canvasWrap');
  wrap.classList.add('diagram');
  const G=buildGraph(project);
  const sizeFn=d=>({w:190,h:30+(d.interfaces?.length||0)*17+8});
  const pos=levelLayout(project,G,sizeFn);
  let W=1250,H=400;
  for(const k in pos){W=Math.max(W,pos[k].x+pos[k].w+40);H=Math.max(H,pos[k].y+pos[k].h+60);}
  const portPt=(devId,ifId,side)=>{
    const z=pos[devId];const d=G.devMap[devId];
    const idx=(d.interfaces||[]).findIndex(i=>i.id===ifId);
    if(!z||idx<0)return null;
    return {x:side==='l'?z.x:z.x+z.w,y:z.y+30+idx*17+8};
  };
  const p=[];
  p.push(`<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">`);
  p.push(`<rect width="${W}" height="${H}" fill="#F8FAFC"/>`);
  const ptBoxes=project.devices.filter(d=>pos[d.id]).map(d=>({id:d.id,x:pos[d.id].x,y:pos[d.id].y,w:pos[d.id].w,h:pos[d.id].h}));
  for(const l of project.links||[]){
    const za=pos[l.a.deviceId],zb=pos[l.b.deviceId];
    if(!za||!zb)continue;
    const aLeft=za.x+za.w/2>zb.x+zb.w/2;
    const pa=portPt(l.a.deviceId,l.a.ifId,aLeft?'l':'r');
    const pb=portPt(l.b.deviceId,l.b.ifId,aLeft?'r':'l');
    if(!pa||!pb)continue;
    const wl=l.type==='wireless';
    const ext=22;
    const roff=routeOff('port',l.id);
    const ax=(aLeft?pa.x-ext:pa.x+ext)+roff.dx,bx=(aLeft?pb.x+ext:pb.x-ext)+roff.dx;
    const my=(pa.y+pb.y)/2+roff.dy;
    const ptsP=avoidBoxes([[pa.x,pa.y],[ax,pa.y],[ax,my],[bx,my],[bx,pb.y],[pb.x,pb.y]],
      ptBoxes.filter(b=>b.id!==l.a.deviceId&&b.id!==l.b.deviceId));
    const d='M'+ptsP.map(q=>q.join(',')).join(' L');
    p.push(`<path d="${d}" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>`);
    p.push(`<path d="${d}" data-cable="${esc(l.id)}" fill="none" stroke="${wl?'#84CC16':'#64748B'}" stroke-width="2" ${wl?'stroke-dasharray="6,4"':''} stroke-linejoin="round"/>`);
  }
  for(const d of project.devices){
    const z=pos[d.id];if(!z)continue;
    const s=DEV_TYPES[d.type]||DEV_TYPES.pc;
    p.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="8" fill="white" stroke="${s.border}" stroke-width="2"/>`);
    p.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="22" rx="8" fill="${s.bg}" stroke="${s.border}" stroke-width="1"/>`);
    p.push(`<text x="${z.x+z.w/2}" y="${z.y+15}" font-size="10.5" fill="#1E293B" font-weight="700" text-anchor="middle">${esc(d.name)}</text>`);
    (d.interfaces||[]).forEach((i,idx)=>{
      const yy=z.y+30+idx*17+8;
      const linked=(project.links||[]).some(l=>
        (l.a.deviceId===d.id&&l.a.ifId===i.id)||(l.b.deviceId===d.id&&l.b.ifId===i.id));
      p.push(`<circle cx="${z.x}" cy="${yy}" r="3.5" fill="${linked?'#16A34A':'#E2E8F0'}" stroke="white" stroke-width="1"/>`);
      p.push(`<circle cx="${z.x+z.w}" cy="${yy}" r="3.5" fill="${linked?'#16A34A':'#E2E8F0'}" stroke="white" stroke-width="1"/>`);
      // drop trailing fields until the row fits inside the box
      const parts=[i.name,i.ip?`${i.ip}/${i.prefix}`:null,i.vlanId!=null?`VLAN ${i.vlanId}`:null,
        (i.allowedVlans||[]).length?`Trunk ${i.allowedVlans.join(',')}`:null].filter(Boolean);
      const AVW=z.w-18;
      let info=parts.join('  ');
      while(parts.length>1&&textWidth(info,8.5,'400')>AVW){ parts.pop(); info=parts.join('  '); }
      if(textWidth(info,8.5,'400')>AVW) info=fitLabel(info,AVW,8.5,7,'400').text;
      p.push(`<text x="${z.x+9}" y="${yy+3}" font-size="8.5" fill="#334155">${esc(info)}</text>`);
    });
  }
  p.push('</svg>');
  wrap.innerHTML=p.join('');
  applyZoom();
  attachCableDrag('port');
  attachCableHover();
}
function renderIpList(){

function renderPalette(filter){
  const el=document.getElementById('palette');
  const h=[`<div class="search-box"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input placeholder="検索…" value="${esc(filter||'')}" oninput="renderPaletteFiltered(this.value)"></div>`];
  for(const cat of PAL_CATS){
    const items=Object.entries(DEV_TYPES).filter(([t,s])=>s.cat===cat&&
      (!filter||s.label.toLowerCase().includes(filter.toLowerCase())||t.includes(filter.toLowerCase())));
    if(items.length===0) continue;
    h.push(`<details open><summary>${cat}</summary>`);
    for(const [t,s] of items){
      h.push(`<div class="pal-item" draggable="true" ondragstart="palDrag(event,'${t}')" onclick="addDevice('${t}')"><div class="pal-dot" style="background:${s.border}"></div>${s.label}</div>`);
    }
    h.push('</details>');
  }
  el.innerHTML=h.join('');
  const inp=el.querySelector('.search-box input');
  if(filter!==undefined&&inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}
function renderPaletteFiltered(v){ renderPalette(v); }
function palDrag(e,type){ e.dataTransfer.setData('text/devtype',type); }

let addOffset=0;
function addDevice(type,x,y){
  const id=type+'-'+Date.now().toString(36);
  const s=DEV_TYPES[type];
  const dev={id,type,name:s.label,
    x:x??(80+addOffset%200),y:y??(80+addOffset%160),
    interfaces:[{id:'if1',name:'Port1',role:'lan'}]};
  if(type==='l2sw') dev.switchType='smart';
  project.devices.push(dev);
  resolveOverlap(dev);
  addOffset+=30;
  selectedDev=id; editIfIdx=null; commit();
  if(view!=='physical'){view='physical';renderTabs();}
  renderAll();
  log('ok',`${s.label} を追加しました`);
}
function setupCanvasDnD(){
  const wrap=document.getElementById('canvasWrap');
  wrap.addEventListener('dragover',e=>{ if(e.dataTransfer.types.includes('text/devtype')) e.preventDefault(); });
  wrap.addEventListener('drop',e=>{
    const type=e.dataTransfer.getData('text/devtype');
    if(!type) return;
    e.preventDefault();
    const svg=wrap.querySelector('svg');
    let x=100,y=100;
    if(svg){
      const r=svg.getBoundingClientRect();
      x=Math.round((e.clientX-r.left)/zoom/10)*10;
      y=Math.round((e.clientY-r.top)/zoom/10)*10;
    }
    if(view!=='physical'){view='physical';renderTabs();}
    addDevice(type,Math.max(0,x-75),Math.max(0,y-20));
  });
}

function fieldInfo(k){const f=FIELD_INFO[k];if(!f)return;
  exSet(`<div class="ex-card"><h4>${esc(f[0])}とは</h4><p>${esc(f[1])}</p></div>`);showBTab('explain');}
function infoI(k){return FIELD_INFO[k]?`<span class="info-i" onclick="fieldInfo('${k}')">ⓘ</span>`:'';}

// ── Realtime field validation ──
function validIpStr(v){return /^(\d{1,3}\.){3}\d{1,3}$/.test(v)&&v.split('.').every(o=>+o<=255);}
function liveStat(el,kind){
  const box=el.closest('.fld')?.querySelector('.fstat');if(!box)return;
  const v=el.value.trim();
  if(!v){box.textContent='';box.className='fstat';return;}
  if(!validIpStr(v)){box.textContent='❌ 形式が不正です';box.className='fstat err';return;}
  if(kind==='ip'){
    let dup=0;
    for(const dd of project.devices)for(const ii of dd.interfaces||[])if(ii.ip===v)dup++;
    if(dup>0&&el.dataset.orig!==v){box.textContent='⚠ Duplicate IP';box.className='fstat warn';return;}
  }
  box.textContent='✔ OK';box.className='fstat ok';
}
function ipStatusHtml(i){
  if(!i.ip)return '<div class="fstat"></div>';
  if(!validIpStr(i.ip))return '<div class="fstat err">❌ 形式が不正です</div>';
  let dup=0;
  for(const dd of project.devices)for(const ii of dd.interfaces||[])if(ii.ip===i.ip)dup++;
  if(dup>1)return '<div class="fstat warn">⚠ Duplicate IP</div>';
  return '<div class="fstat ok">✔ OK</div>';
}
function gwStatusHtml(i){
  if(!i.gateway)return '<div class="fstat"></div>';
  if(!validIpStr(i.gateway))return '<div class="fstat err">❌ 形式が不正です</div>';
  if(i.ip&&i.prefix!=null&&!inNet(i.gateway,netOf(i.ip,+i.prefix)))return '<div class="fstat err">❌ Invalid Gateway（別サブネット）</div>';
  const G=buildGraph(project);
  if(!G.ipIndex[i.gateway])return '<div class="fstat warn">⚠ このIPを持つ機器がありません</div>';
  return '<div class="fstat ok">✔ OK</div>';
}

// ── Device-type section schema ──
function sectionsFor(d){
  switch(d.type){
    case 'internet': return ['generalMin'];
    case 'onu':      return ['generalMin','interfaces'];
    case 'router':   return ['general','interfaces','routing','nat','acl','notes'];
    case 'firewall': return ['general','interfaces','secpolicy','nat','notes'];
    case 'utm':      return ['general','interfaces','utmsec','nat','notes'];
    case 'l3sw':     return ['general','ports','vlans','routing','stp','notes'];
    case 'l2sw':     return d.switchType==='unmanaged'?['general','ports','notes']:['general','ports','vlans','stp','notes'];
    case 'server': case 'nas': return ['generalServer','network','storage','notes'];
    case 'pc': case 'laptop':  return ['general','network','notes'];
    case 'printer':  return ['general','network'];
    case 'ap':       return ['general','interfaces','ssid','notes'];
    default:         return ['general','interfaces','notes'];
  }
}
const IF_SECTION_LABEL={interfaces:'Interfaces',ports:'Ports',network:'Network'};

function fld(label,inner,infoKey){
  return `<div class="fld"><label>${esc(label)}${infoKey?infoI(infoKey):''}</label>${inner}</div>`;
}
function txtFld(label,key,val,ph){
  return fld(label,`<input value="${esc(val||'')}" placeholder="${esc(ph||'')}" onchange="updDev('${key}',this.value)">`);
}

function renderProps(){
  const el=document.getElementById('props');
  if(propDevId!==selectedDev){propDevId=selectedDev;editIfIdx=editVlanIdx=editSsidIdx=null;}
  const d=project.devices.find(x=>x.id===selectedDev);
  if(!d){
    el.innerHTML='<div class="prop-title">Properties</div><div class="empty-hint">機器をクリックすると、その機器専用の編集画面が表示されます。<br><br>左のパレットからキャンバスへドラッグ＆ドロップで機器を追加、「接続」モードでポート同士を接続します。</div>';
    return;
  }
  const s=DEV_TYPES[d.type]||DEV_TYPES.pc;

  if(editIfIdx!=null&&d.interfaces?.[editIfIdx]) return renderIfDetail(el,d,s);
  if(editVlanIdx!=null&&d.vlans?.[editVlanIdx]) return renderVlanDetail(el,d,s);
  if(editSsidIdx!=null&&d.ssids?.[editSsidIdx]) return renderSsidDetail(el,d,s);
  editIfIdx=editVlanIdx=editSsidIdx=null;

  const secs=sectionsFor(d);
  const h=[`<div class="prop-title"><span class="badge" style="background:${s.border}">${s.tag}</span>${esc(d.name)}</div>`];
  for(const sec of secs) h.push(SEC_RENDER[sec](d,s));
  h.push(`<button class="danger-btn" onclick="delDevice()">この機器を削除</button>`);
  el.innerHTML=h.join('');
}

function renderIfDetail(el,d,s){
  const i=d.interfaces[editIfIdx];
  const isSwitch=d.type==='l2sw'||d.type==='l3sw';
  const unmanaged=d.type==='l2sw'&&d.switchType==='unmanaged';
  const isHost=['server','nas','pc','laptop','printer'].includes(d.type);
  const idx=editIfIdx;
  const h=[`<button class="back-btn" onclick="editIfIdx=null;renderProps()">← 一覧に戻る</button>`,
    `<div class="prop-title"><span class="badge" style="background:${s.border}">${s.tag}</span>${esc(i.name)}</div>`];
  h.push(fld('Name',`<input value="${esc(i.name)}" onchange="updIf(${idx},'name',this.value)">`));
  h.push(fld('Speed',`<input value="${esc(i.speed||'')}" placeholder="1G / 10G" onchange="updIf(${idx},'speed',this.value)">`));

  if(isSwitch&&!unmanaged){
    h.push(fld('Mode',`<select onchange="updIf(${idx},'role',this.value)">
      ${['access','trunk','lan','svi'].map(r=>`<option value="${r}"${i.role===r?' selected':''}>${{access:'Access',trunk:'Trunk',lan:'Routed (L3)',svi:'SVI (VLAN IF)'}[r]}</option>`).join('')}
    </select>`,'trunk'));
    if(i.role==='access'||i.role==='svi')
      h.push(fld('VLAN ID',`<input type="number" value="${esc(i.vlanId??'')}" placeholder="10" onchange="updIf(${idx},'vlanId',this.value===''?null:+this.value)">`,'vlan'));
    if(i.role==='trunk')
      h.push(fld('許可VLAN（カンマ区切り）',`<input value="${esc((i.allowedVlans||[]).join(','))}" placeholder="10,20,30" onchange="updIf(${idx},'allowedVlans',this.value?this.value.split(',').map(Number).filter(n=>!isNaN(n)):null)">`,'trunk'));
    if(i.role==='lan'||i.role==='svi'){
      h.push(fld('IP Address',`<input value="${esc(i.ip||'')}" data-orig="${esc(i.ip||'')}" placeholder="192.168.1.1" oninput="liveStat(this,'ip')" onchange="updIf(${idx},'ip',this.value)">${ipStatusHtml(i)}`,'ip'));
      h.push(fld('Prefix',`<input type="number" min="0" max="32" value="${esc(i.prefix??'')}" placeholder="24" onchange="updIf(${idx},'prefix',this.value===''?null:+this.value)">`,'prefix'));
    }
  } else if(unmanaged){
    h.push(`<div class="empty-hint" style="padding:4px 0 12px">アンマネージドスイッチのため、VLAN・IPの設定項目はありません。全ポートが同一ネットワークで動作します。${infoI('switchType')}</div>`);
  } else {
    h.push(fld('Role',`<select onchange="updIf(${idx},'role',this.value)">${ROLES.map(r=>`<option${i.role===r?' selected':''}>${r}</option>`).join('')}</select>`));
    h.push(fld('IP Address',`<input value="${esc(i.ip||'')}" data-orig="${esc(i.ip||'')}" placeholder="192.168.1.1" oninput="liveStat(this,'ip')" onchange="updIf(${idx},'ip',this.value)">${ipStatusHtml(i)}`,'ip'));
    h.push(fld('Prefix',`<input type="number" min="0" max="32" value="${esc(i.prefix??'')}" placeholder="24" onchange="updIf(${idx},'prefix',this.value===''?null:+this.value)">`,'prefix'));
    h.push(fld('Gateway',`<input value="${esc(i.gateway||'')}" placeholder="192.168.1.254" oninput="liveStat(this,'gw')" onchange="updIf(${idx},'gateway',this.value)">${gwStatusHtml(i)}`,'gateway'));
    if(isHost) h.push(fld('DNS',`<input value="${esc(i.dns||'')}" placeholder="8.8.8.8" onchange="updIf(${idx},'dns',this.value)">`,'dns'));
    if(!isHost&&i.vlanId!=null||['pc','laptop','printer','ap'].includes(d.type))
      h.push(fld('VLAN ID',`<input type="number" value="${esc(i.vlanId??'')}" onchange="updIf(${idx},'vlanId',this.value===''?null:+this.value)">`,'vlan'));
    h.push(`<details><summary style="font-size:12px;color:var(--text2);cursor:pointer;padding:4px 0 12px">Advanced</summary>
      ${fld('MAC',`<input value="${esc(i.mac||'')}" placeholder="00:11:22:…" onchange="updIf(${idx},'mac',this.value)">`)}
    </details>`);
  }
  h.push(fld('Description',`<input value="${esc(i.description||'')}" onchange="updIf(${idx},'description',this.value)">`));
  h.push(`<button class="danger-btn" onclick="delIf(${idx})">このインターフェースを削除</button>`);
  el.innerHTML=h.join('');
}

function curDev(){return project.devices.find(x=>x.id===selectedDev);}
function updDev(k,v){const d=curDev();if(d){d[k]=v;commit();renderAll();}}
function updIf(idx,k,v){const d=curDev();if(d&&d.interfaces[idx]){d.interfaces[idx][k]=(v===''?undefined:v);commit();renderView();renderExplainSelects();renderProps();}}
function delIf(idx){const d=curDev();if(!d)return;
  const i=d.interfaces[idx];
  project.links=project.links.filter(l=>!((l.a.deviceId===d.id&&l.a.ifId===i.id)||(l.b.deviceId===d.id&&l.b.ifId===i.id)));
  d.interfaces.splice(idx,1);editIfIdx=null;commit();renderAll();}
function addIf(){const d=curDev();if(!d)return;
  const n=(d.interfaces?.length||0)+1;
  (d.interfaces=d.interfaces||[]).push({id:'if'+Date.now().toString(36),name:'Port'+n,role:'lan'});
  editIfIdx=d.interfaces.length-1;commit();renderAll();}
function delRoute(idx){const d=curDev();if(d?.routes){d.routes.splice(idx,1);commit();renderAll();}}
function addRouteFromForm(){
  const d=curDev();if(!d)return;
  const dest=document.getElementById('nr-dest').value.trim();
  const pfx=+document.getElementById('nr-pfx').value;
  const nh=document.getElementById('nr-nh').value.trim();
  if(!dest||!nh||isNaN(pfx)){log('warn','宛先・prefix・next hopをすべて入力してください');return;}
  (d.routes=d.routes||[]).push({destination:dest,prefix:pfx,nextHop:nh,protocol:'Static'});
  commit();renderAll();

  const devId=document.getElementById(devSelId)?.value;
  const dev=project.devices.find(d=>d.id===devId);

// ── Terminal-style log system ──
let logEntries=[], logFilter='All', logSearch='', simSpeed=1;
function nowTs(){const d=new Date();
  return '['+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+']';}
function addLog(lv,msg,det){
  logEntries.push({t:nowTs(),lv,msg,det});
  if(logEntries.length>800) logEntries.shift();
  renderLogs();
}
function log(level,msg){
  addLog({ok:'SUCCESS',err:'ERROR',warn:'WARNING',info:'INFO'}[level]||String(level).toUpperCase(),msg);
}
function renderLogs(){
  const out=document.getElementById('logout'); if(!out) return;
  const q=logSearch.toLowerCase();
  const items=logEntries.filter(e=>(logFilter==='All'||e.lv===logFilter)&&(!q||e.msg.toLowerCase().includes(q)));
  out.innerHTML=items.map(e=>
    `<div class="lline"><span class="lts">${e.t}</span> <span class="lv-${e.lv}">${e.lv.padEnd(7,' ')}</span> <span class="lmsg">${esc(e.msg)}</span></div>`+
    (e.det||[]).map(dl=>`<div class="ldet">${esc(dl)}</div>`).join('')).join('');
  out.scrollTop=out.scrollHeight;
}
function clearLogs(){logEntries=[];renderLogs();}
function copyLogs(){
  const txt=logEntries.map(e=>`${e.t} ${e.lv} ${e.msg}`).join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>addLog('INFO','ログをコピーしました'));

// Canvas pan & wheel zoom
(function(){
  const wrap=document.getElementById('canvasWrap');
  let pan=null;
  wrap.addEventListener('mousedown',e=>{
    if(drag) return; // device drag has priority
    // ケーブル(data-cable)とドラッグ対象はパン開始の対象外にする（手動調整を優先）
    const interactive=e.target.closest('.dev-g,.port-c,[data-cable],[data-drag],button,input,select,a,.list-row');
    const isBg=e.target.dataset?.bg||e.target.tagName==='svg'||(!interactive&&e.target.closest('svg'));
    if(spaceDown||isBg){
      pan={sx:e.clientX,sy:e.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop,moved:false};
      wrap.style.cursor='grabbing';
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove',e=>{
    if(!pan) return;
    const dx=e.clientX-pan.sx, dy=e.clientY-pan.sy;
    if(Math.abs(dx)+Math.abs(dy)>3) pan.moved=true;
    wrap.scrollLeft=pan.sl-dx; wrap.scrollTop=pan.st-dy;
  });
  window.addEventListener('mouseup',()=>{
    if(pan){wrap.style.cursor=spaceDown?'grab':'';lastPanMoved=pan.moved;}
    else lastPanMoved=false;
    pan=null;
  });
  wrap.addEventListener('wheel',e=>{
    // 表ビュー: 通常ホイール=縦スクロール / Shift=横スクロール（ズームしない）
    if(!isDiagramView()){
      if(e.shiftKey){ wrap.scrollLeft+=e.deltaY; e.preventDefault(); }
      return; // 既定の縦スクロールに任せる
    }
    if(e.shiftKey){ wrap.scrollLeft+=e.deltaY; e.preventDefault(); return; }
    // 図ビュー: ホイール=ズーム（カーソル位置中心）
    e.preventDefault();
    const rect=wrap.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    const old=zoom;
    setZoom(zoom+(e.deltaY>0?-0.1:0.1));
    if(zoom!==old){
      const f=zoom/old;
      wrap.scrollLeft=(wrap.scrollLeft+cx)*f-cx;
      wrap.scrollTop=(wrap.scrollTop+cy)*f-cy;
    }
  },{passive:false});
})();

// ═══════════════════════════════════════════════════════
// Auto Layout (hierarchical + subnet grouping)
// ═══════════════════════════════════════════════════════
function applyAutoLayout(){
  const G=buildGraph(project);
  const level=bfsLevels(project,G);
  const byLv={};
  for(const d of project.devices)(byLv[level[d.id]]=byLv[level[d.id]]||[]).push(d);
  const netKeyOf=d=>{
    const i=(d.interfaces||[]).find(x=>x.ip&&x.role!=='wan');
    if(i) return netOf(i.ip,+(i.prefix??24));
    const a=(d.interfaces||[]).find(x=>x.vlanId!=null);
    return a?('vlan'+String(a.vlanId).padStart(4,'0')):'~';
  };
  const keys=Object.keys(byLv).map(Number).sort((a,b)=>a-b);
  const GX=130,GY=150,W=1600;   // 外側ポートラベル分の余白を確保
  let y=90;
  for(const k of keys){
    const row=byLv[k].slice().sort((a,b)=>netKeyOf(a)<netKeyOf(b)?-1:netKeyOf(a)>netKeyOf(b)?1:0);
    const totW=row.reduce((a,b)=>a+devBoxW(b),0)+(row.length-1)*GX;
    let x=Math.max(40,(W-totW)/2),maxH=0;
    for(const d of row){ d.x=Math.round(x/10)*10; d.y=Math.round(y/10)*10; x+=devBoxW(d)+GX; maxH=Math.max(maxH,devBoxH(d)); }
    y+=maxH+GY;
  }
  commit();
  if(view!=='physical'){view='physical';renderTabs();}
  renderAll();
  addLog('INFO','自動整列を実行しました（階層×サブネット順）');
}

// ═══════════════════════════════════════════════════════
// Packet Simulation
// ═══════════════════════════════════════════════════════
function computeHopChain(G,src,dst,dstIp){
  const chain=[src.id]; let cur=src; const visited=new Set(); let hop=0;
  while(hop++<15){
    if(visited.has(cur.id)) return null;
    visited.add(cur.id);
    if(cur.id===dst.id) return chain;
    const direct=deviceNets(cur).find(n=>inNet(dstIp,n.cidr));
    if(direct){ chain.push(dst.id); return chain; }
    let nextIp=null;
    const m=longestMatch(cur,dstIp);
    if(m&&m.type==='route') nextIp=m.route.nextHop;
    else { const gwIf=(cur.interfaces||[]).find(i=>i.gateway); if(gwIf) nextIp=gwIf.gateway; }
    if(!nextIp) return null;
    const nh=G.ipIndex[nextIp]; if(!nh) return null;
    chain.push(nh.deviceId);
    cur=G.devMap[nh.deviceId];
  }
  return null;
}
function bfsPath(adj,from,to){
  if(from===to) return [from];
  const prev={[from]:null}; const q=[from];
  while(q.length){
    const c=q.shift();
    for(const nb of adj[c]||[]){
      if(prev[nb]!==undefined) continue;
      prev[nb]=c;
      if(nb===to){ const path=[to]; let p=c; while(p!==null){path.unshift(p);p=prev[p];} return path; }
      q.push(nb);
    }
  }
  return null;
}
let simRunning=false;
const simCtl={paused:false,stopped:false};
function pauseSim(btn){
  if(!simRunning) return;
  simCtl.paused=!simCtl.paused;
  btn.textContent=simCtl.paused?'▶':'⏸';
  addLog('INFO',simCtl.paused?'Simulation paused':'Simulation resumed');
}
function stopSim(){ if(simRunning) simCtl.stopped=true; }
async function simulatePacket(){
  if(simRunning){addLog('WARNING','シミュレーション実行中です');return;}
  const G=buildGraph(project);
  const src=G.devMap[document.getElementById('expFrom').value];
  const dst=G.devMap[document.getElementById('expTo').value];
  if(!src||!dst){addLog('WARNING','送信元と宛先を選択してください');return;}
  const dstIf=selectedIface(dst.id,'expToIf');
  if(!dstIf){addLog('WARNING',`${dst.name} にIPアドレスがありません`);return;}
  const chain=computeHopChain(G,src,dst,dstIf.ip);
  if(!chain){addLog('ERROR','経路が見つかりません（ルート/GW設定を確認してください）');return;}
  // expand L3 hops to physical path
  const full=[];
  for(let i=0;i<chain.length-1;i++){
    const seg=bfsPath(G.phys,chain[i],chain[i+1]);
    if(!seg){addLog('ERROR',`物理経路がありません: ${G.devMap[chain[i]].name} → ${G.devMap[chain[i+1]].name}`);return;}
    full.push(...(i===0?seg:seg.slice(1)));
  }
  if(view!=='physical'){view='physical';renderTabs();renderView();}
  showBTab('logs');
  simRunning=true; simCtl.paused=false; simCtl.stopped=false;
  const pb=document.getElementById('pauseBtn'); if(pb) pb.textContent='⏸';
  const srcIf=selectedIface(src.id,'expFromIf');
  const srcIp=srcIf?`${srcIf.ip} (${srcIf.name})`:'—';
  addLog('PACKET','Packet Generated',[`Source:      ${src.name}  ${srcIp}`,`Destination: ${dst.name}  ${dstIf.ip} (${dstIf.name})`]);
  const t0=performance.now();
  try{
    for(let i=0;i<full.length-1;i++){
      if(simCtl.stopped){addLog('WARNING','Simulation stopped');return;}
      const a=full[i],b=full[i+1];
      const link=(project.links||[]).find(l=>
        (l.a.deviceId===a&&l.b.deviceId===b)||(l.a.deviceId===b&&l.b.deviceId===a));
      const da=G.devMap[a],db=G.devMap[b];
      addLog(chain.includes(a)&&chain.includes(b)&&chain.indexOf(b)===chain.indexOf(a)+1?'ROUTE':'PACKET',
        `${da.name} → ${db.name}${link?.speed?'  ('+link.speed+')':''}`);
      if(link){
        const r=await animateAlongLink(link,a);
        if(r==='stopped'){addLog('WARNING','Simulation stopped');return;}
      }
    }
    addLog('SUCCESS','Destination reached',[`RTT  ${((performance.now()-t0)/1000*0.02+0.4).toFixed(2)} ms`]);
  } finally { simRunning=false; simCtl.paused=false; simCtl.stopped=false; if(pb) pb.textContent='⏸'; }
}
function animateAlongLink(link,fromDevId){
  return new Promise(res=>{
    const svg=document.getElementById('physSvg');
    const pathEl=svg?.querySelector(`path[data-link="${CSS.escape(link.id)}"]`);
    if(!pathEl){res();return;}
    const len=pathEl.getTotalLength();
    const reverse=link.b.deviceId===fromDevId;
    const NS='http://www.w3.org/2000/svg';
    const halo=document.createElementNS(NS,'circle');
    halo.setAttribute('r','9');halo.setAttribute('fill','#FDE047');halo.setAttribute('opacity','.35');
    const dot=document.createElementNS(NS,'circle');
    dot.setAttribute('r','5');dot.setAttribute('fill','#FDE047');dot.setAttribute('stroke','#F59E0B');dot.setAttribute('stroke-width','2');
    svg.appendChild(halo);svg.appendChild(dot);
    const dur=Math.max(250,len/(300*simSpeed)*1000);
    let elapsed=0, last=performance.now();
    function step(now){
      if(simCtl.stopped){ dot.remove(); halo.remove(); res('stopped'); return; }
      const dt=now-last; last=now;
      if(!simCtl.paused) elapsed+=dt;
      const t=Math.min(1,elapsed/dur);
      const pt=pathEl.getPointAtLength((reverse?1-t:t)*len);
      dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);
      halo.setAttribute('cx',pt.x);halo.setAttribute('cy',pt.y);
      if(t<1) requestAnimationFrame(step);
      else { dot.remove(); halo.remove(); res(); }
    }
    requestAnimationFrame(step);
  });
}
