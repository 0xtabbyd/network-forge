<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Designer v0.5</title>
<style>
:root{
  --bg:#1E1E1E; --panel:#252526; --panel2:#2D2D30; --border:#3C3C3C;
  --text:#CCCCCC; --text2:#9D9D9D; --text3:#6E6E6E;
  --accent:#3B82F6; --danger:#EF4444; --ok:#22C55E; --info:#0EA5E9; --warn:#F59E0B;
}
body[data-theme="light"]{
  --bg:#ECECEC; --panel:#F8F8F8; --panel2:#FFFFFF; --border:#D5D5D5;
  --text:#1F1F1F; --text2:#555555; --text3:#909090;
}
body.fs #palette,body.fs #props,body.fs #bottombar,body.fs #bottomResize{display:none!important}
body.hide-left #palette{display:none}
body.hide-right #props{display:none}
body.hide-left #palette{display:none}
body.hide-right #props{display:none}
.tb-btn.pon{color:var(--accent)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button{font-family:inherit}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ═══ Toolbar ═══ */
#toolbar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;min-height:52px}
.brand{font-weight:700;font-size:15px;color:var(--text);margin-right:10px;white-space:nowrap}
.brand small{font-size:11px;color:var(--text3);font-weight:400;margin-left:4px}
.tb-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid transparent;
  border-radius:6px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}
.tb-btn:hover{background:var(--panel2);color:var(--text)}
.tb-btn.active{background:#1d4ed8;color:#fff}
.tb-btn:disabled{opacity:.35;cursor:default}
.tb-btn:disabled:hover{background:transparent;color:var(--text2)}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px}
.view-tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px;margin:0 6px}
.vtab{padding:7px 14px;border:none;border-radius:6px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}
.vtab.active{background:var(--accent);color:#fff}
.vtab:hover:not(.active){color:var(--text)}
.tb-right{margin-left:auto;display:flex;gap:4px;align-items:center}
#fi{display:none}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel2);border:1px solid var(--border);
  border-radius:9px;padding:5px;z-index:30;min-width:180px;display:none;box-shadow:0 6px 20px #0005}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border:none;border-radius:6px;
  background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel)}
.menu .mdiv{height:1px;background:var(--border);margin:4px 6px}
#explainCtl button{height:36px;padding:0 14px;background:var(--panel2);border:1px solid var(--border);
  border-radius:7px;color:var(--text2);font-size:13px;cursor:pointer}
#explainCtl button:hover{color:var(--text);border-color:var(--text3)}

/* ═══ Main ═══ */
#main{flex:1;display:flex;overflow:hidden}

/* Palette */
#palette{width:200px;background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;padding:16px 12px;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;margin-bottom:16px}
.search-box input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none;min-width:0}
.search-box svg{color:var(--text3)}
#palette details{margin-bottom:8px}
#palette summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.07em;padding:6px 4px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
#palette summary::before{content:'▾';font-size:10px;transition:transform .15s}
#palette details:not([open]) summary::before{transform:rotate(-90deg)}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:grab;
  color:var(--text);font-size:14px;border:1px solid transparent;margin:2px 0}
.pal-item:hover{background:var(--panel2);border-color:var(--border)}
.pal-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}

/* Canvas */
#canvasArea{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#canvasWrap{flex:1;overflow:auto;background:var(--bg)}
#canvasWrap.diagram{background:#F4F5F7}
#zoomBar{position:absolute;right:16px;top:14px;display:flex;gap:2px;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:3px;z-index:5;align-items:center}
#zoomBar button{width:32px;height:30px;border:none;background:transparent;color:var(--text2);
  font-size:16px;cursor:pointer;border-radius:5px}
#zoomBar button:hover{background:var(--panel2);color:var(--text)}
#zoomVal{font-size:12px;color:var(--text2);min-width:42px;text-align:center}

/* Properties */
#props{width:300px;background:var(--panel);border-left:1px solid var(--border);
  overflow-y:auto;padding:20px 16px;flex-shrink:0}
#props details{margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:16px}
#props summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:.07em;padding:4px 0 12px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
#props summary::before{content:'▾';font-size:10px;transition:transform .15s}
#props details:not([open]) summary::before{transform:rotate(-90deg)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;height:40px;padding:8px 12px;background:var(--panel2);
  border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px}
.fld textarea{height:72px;resize:vertical;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.fld-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel2);
  border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.list-row:hover{border-color:var(--accent)}
.list-row .nm{font-size:14px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .sub{font-size:12px;color:var(--text2);font-family:'SF Mono',Menlo,monospace;white-space:nowrap}
.list-row .chev{color:var(--text3);font-size:14px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.add-btn{width:100%;height:40px;border:1px dashed var(--border);border-radius:8px;background:transparent;
  color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.add-btn:hover{color:var(--text);border-color:var(--text2)}
.danger-btn{width:100%;height:40px;border:1px solid #7f1d1d;border-radius:8px;background:transparent;
  color:var(--danger);font-size:14px;cursor:pointer;margin-top:8px}
.danger-btn:hover{background:#7f1d1d33}
.back-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--accent);
  font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:16px}
.empty-hint{color:var(--text3);font-size:14px;line-height:1.8;padding:8px 4px}
.prop-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.sec-body{max-height:320px;overflow-y:auto;padding-right:2px}
.fstat{font-size:12.5px;margin-top:5px;min-height:16px}
.fstat.ok{color:var(--ok)}.fstat.warn{color:var(--warn)}.fstat.err{color:var(--danger)}
.info-i{cursor:pointer;color:var(--text3);margin-left:6px;font-size:13px;user-select:none}
.info-i:hover{color:var(--accent)}
.chk-row{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:14px;color:var(--text)}
.chk-row input{width:18px;height:18px;accent-color:var(--accent)}
.inline-add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.inline-add input,.inline-add select{height:40px;padding:8px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.inline-add .full{grid-column:1/3}

/* ═══ Bottom Panel ═══ */
#bottomResize{height:5px;background:var(--panel);cursor:ns-resize;flex-shrink:0;border-top:1px solid var(--border)}
#bottomResize:hover{background:var(--accent)}
#bottombar{height:250px;background:var(--panel);flex-shrink:0;display:flex;flex-direction:column;min-height:80px}
#btabs{display:flex;gap:2px;padding:6px 16px 0;border-bottom:1px solid var(--border);align-items:center}
.btab{padding:8px 16px;border:none;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;
  border-bottom:2px solid transparent}
.btab.active{color:var(--text);border-bottom-color:var(--accent)}
.btab .cnt{display:inline-block;background:var(--danger);color:#fff;font-size:10px;border-radius:8px;
  padding:1px 6px;margin-left:6px;font-weight:700}
.bpane{flex:1;overflow-y:auto;padding:12px 20px;display:none;font-size:14px;line-height:1.9}
.bpane.active{display:block}
/* Terminal-style logs */
#pane-logs{padding:0;display:none;flex-direction:column;overflow:hidden}
#pane-logs.active{display:flex}
#logbar{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
#logbar select,#logbar input{height:30px;padding:2px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12.5px}
#logbar input{width:160px}
#logbar button{height:30px;padding:0 10px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer}
#logbar button:hover{color:var(--text);border-color:var(--text3)}
#logout{flex:1;overflow-y:auto;background:#0C0C0C;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:13px;padding:10px 16px;line-height:1.8}
.lline{white-space:pre-wrap;word-break:break-all}
.lts{color:#6E7681}
.lv-INFO{color:#569CD6}.lv-SUCCESS{color:#3FB950}.lv-WARNING{color:#E5C07B}
.lv-ERROR{color:#F14C4C}.lv-ROUTE{color:#56B6C2}.lv-PACKET{color:#C678DD}
.lmsg{color:#D4D4D4}
.ldet{color:#9DA5B4;padding-left:8.5em;white-space:pre-wrap}
.net-label{cursor:pointer}
.vitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;cursor:pointer;margin-bottom:4px}
.vitem:hover{background:var(--panel2)}
.vitem .vlv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;flex-shrink:0}
#explainCtl{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#explainCtl select{height:36px;padding:4px 10px;background:var(--panel2);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:14px}
.ex-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.ex-card h4{font-size:15px;color:var(--text);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ex-card p{font-size:14px;color:var(--text2);line-height:1.8}

/* Diagram tables */
.tblwrap{padding:24px;color:#1e293b}
.tblwrap h2{font-size:18px;margin-bottom:14px;color:#0f172a}
table.data{border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0002}
table.data th{background:#F1F5F9;color:#64748B;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;text-align:left}
table.data td{padding:9px 16px;border-top:1px solid #E2E8F0;font-size:14px;font-family:'SF Mono',Menlo,monospace}
table.data td.n{font-family:inherit}
.chip{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700;color:#fff}
.vlan-grid{display:flex;flex-wrap:wrap;gap:18px;padding:24px}
.vlan-card{background:white;border-radius:12px;min-width:250px;max-width:320px;overflow:hidden;box-shadow:0 1px 3px #0002}
.vlan-card .vh{padding:12px 16px;font-weight:700;font-size:15px;color:#fff}
.vlan-card .vb{padding:12px 16px}
.vlan-card .sec{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}
.vlan-card .mem{font-size:13px;padding:3px 0;color:#334155;font-family:'SF Mono',Menlo,monospace}
svg.diagram-svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none}
path[data-link]{transition:stroke-width .1s}
path[data-link]:hover{stroke-width:4.5!important;cursor:pointer}
path[data-cable]{cursor:grab;transition:stroke-width .1s}
path[data-cable]:hover{stroke-width:4.5!important}
path[data-cable]:active{cursor:grabbing}
/* cable hover highlight: dim others, hovered copy drawn in overlay layer */
svg.hl-on path[data-cable]{opacity:.13}
svg.hl-on g.dev-g:not(.hl){opacity:.42}
#hlLayer,#hlLayer *{pointer-events:none!important}
.port-hl,.cablbl{pointer-events:none!important}
.dev-g{cursor:grab}
.port-c{cursor:crosshair}
.port-c:hover rect{stroke:#F59E0B;stroke-width:2.2}
.port-c.used{cursor:not-allowed}
/* サイドバー境界のスプリッタ＋開閉ボタン */
.splitter{position:relative;width:8px;flex-shrink:0;background:var(--panel);
  border-left:1px solid var(--border);border-right:1px solid var(--border)}
.sp-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:16px;height:52px;border:1px solid var(--border);border-radius:5px;
  background:var(--panel2);color:var(--text3);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1}
.sp-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.sp-btn::before{content:'';display:block;border:4px solid transparent}
#splitL .sp-btn::before{border-right-color:currentColor;margin-right:3px}
#splitL .sp-btn.pon::before{border-right-color:transparent;border-left-color:currentColor;margin:0 0 0 3px}
#splitR .sp-btn::before{border-left-color:currentColor;margin-left:3px}
#splitR .sp-btn.pon::before{border-left-color:transparent;border-right-color:currentColor;margin:0 3px 0 0}
body.fs .splitter{display:none}
/* 機器ホバー時の詳細パネル */
#devTip{position:absolute;z-index:20;display:none;pointer-events:none;
  background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  padding:11px 13px;box-shadow:0 8px 26px #0007;font-size:13px;color:var(--text);
  max-width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);
  overflow:hidden;box-sizing:border-box}
#devTip .ttwrap{max-height:inherit;overflow:auto}
#devTip .tt{font-size:13.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:7px}
#devTip .tsub{font-size:11.5px;color:var(--text3);margin-bottom:9px}
#devTip table{border-collapse:collapse;width:100%;table-layout:auto}
#devTip th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;
  text-align:left;padding:2px 10px 4px 0;font-weight:600;white-space:nowrap}
#devTip td{font-size:12px;padding:2px 10px 2px 0;font-family:'SF Mono',Menlo,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#devTip td.nm{font-family:inherit;font-weight:600;max-width:110px}
#devTip .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#devTip .tsub,#devTip .meta{overflow-wrap:anywhere}
#devTip .vchip{display:inline-block;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700;color:#fff}
#devTip .meta{margin-top:8px;font-size:11.5px;color:var(--text2);line-height:1.6}
body.linkmode .port-c rect{stroke-width:1.8}
body.linkmode .port-c:hover rect{stroke:#F59E0B;stroke-width:2.4}
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand">Network Designer<small>v0.5</small></span>
  <div class="menu-wrap">
    <button class="tb-btn" onclick="toggleMenu(event)"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v10H3z"/><path d="M3 7V5h6l2 2"/></svg>Project ▾</button>
    <div class="menu" id="projMenu">
      <button onclick="closeMenu();newProject()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
      <button onclick="closeMenu();document.getElementById('fi').click()"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v10H3z"/><path d="M3 7V5h6l2 2"/></svg>Open (JSON)</button>
      <button onclick="closeMenu();exportJSON()"><svg class="ic" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save (JSON)</button>
      <button onclick="closeMenu();exportSVG()"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Export SVG</button>
      <div class="mdiv"></div>
      <button onclick="closeMenu();loadSample()"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>サンプル構成を読込</button>
    </div>
  </div>
  <input type="file" id="fi" accept=".json" onchange="importFile(this)">
  <button class="tb-btn" id="undoBtn" onclick="undo()" title="元に戻す"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>Undo</button>
  <button class="tb-btn" id="redoBtn" onclick="redo()" title="やり直す"><svg class="ic" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>Redo</button>
  <button class="tb-btn" onclick="applyAutoLayout()" title="自動整列"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>整列</button>
  <div class="tb-sep"></div>
  <div class="view-tabs" id="viewTabs"></div>
  <div class="tb-right">
    <button class="tb-btn" id="themeBtn" onclick="cycleTheme()" title="テーマ切替">🌙 Dark</button>
  </div>
</div>

<div id="main">
  <nav id="palette"></nav>
  <div class="splitter" id="splitL"><button class="sp-btn" id="panelLBtn" onclick="togglePanel('left')" title="左パレットを開閉"></button></div>
  <div id="canvasArea">
    <div id="zoomBar">
      <button onclick="setZoom(zoom-0.1)">−</button>
      <span id="zoomVal">100%</span>
      <button onclick="setZoom(zoom+0.1)">＋</button>
      <button onclick="setZoom(1)" title="リセット">⊡</button>
      <button onclick="toggleFullscreen()" title="キャンバス最大化 (Esc)">⛶</button>
    </div>
    <div id="canvasWrap"></div>
    <div id="devTip"></div>
  </div>
  <div class="splitter" id="splitR"><button class="sp-btn" id="panelRBtn" onclick="togglePanel('right')" title="右プロパティを開閉"></button></div>
  <aside id="props"></aside>
</div>

<div id="bottomResize"></div>
<div id="bottombar">
  <div id="btabs">
    <button class="btab active" data-b="logs" onclick="showBTab('logs')">Logs</button>
    <button class="btab" data-b="explain" onclick="showBTab('explain')">Explain</button>
    <button class="btab" data-b="validation" onclick="showBTab('validation')">Validation<span class="cnt" id="vcnt" style="display:none"></span></button>
  </div>
  <div class="bpane active" id="pane-logs">
    <div id="logbar">
      <select id="logFilter" onchange="logFilter=this.value;renderLogs()">
        <option>All</option><option>INFO</option><option>SUCCESS</option><option>WARNING</option>
        <option>ERROR</option><option>ROUTE</option><option>PACKET</option>
      </select>
      <input id="logSearch" placeholder="検索…" oninput="logSearch=this.value;renderLogs()">
      <span style="flex:1"></span>
      <button onclick="copyLogs()">Copy</button>
      <button onclick="saveLogs()">Save</button>
      <button onclick="clearLogs()">Clear</button>
    </div>
    <div id="logout"></div>
  </div>
  <div class="bpane" id="pane-explain">
    <div id="explainCtl">
      <select id="expFrom"></select>

function migrate(json){
  if(json.cables){
    const typeMap={hub:'l2sw',desktop:'pc'};
    const devices=(json.devices||[]).map(d=>({
      id:d.id,type:typeMap[d.type]||((d.type in DEV_TYPES)?d.type:'pc'),
      name:d.name||d.id,manufacturer:d.manufacturer,model:d.model,serial:d.serial,hostname:d.hostname,
      switchType:d.switchType,
      ssids:(d.ssids||[]).map(s=>({id:s.id,name:s.name,band:[s.band24?'2.4GHz':null,s.band5?'5GHz':null].filter(Boolean).join('/')||s.band,vlanId:s.vlanId})),
      x:d.x??100,y:d.y??100,
      interfaces:(d.interfaces||[]).map(i=>{
        let ip,prefix;
        if(i.ip){const sp=String(i.ip).split('/');ip=sp[0];prefix=+(sp[1]??24);}
        let role=i.mode||'lan';
        if(i.type==='virtual')role='svi';
        if(i.type==='wireless')role='wireless';
        return {id:i.id,name:i.name||i.id,role,ip,prefix,vlanId:i.vlanId,mac:i.mac,gateway:d.defaultGateway,allowedVlans:i.allowedVlans};
      }),
      routes:(d.routes||[]).map(r=>{
        const sp=String(r.destNetwork||'0.0.0.0/0').split('/');
        return {destination:sp[0],prefix:+(sp[1]??0),nextHop:r.nextHop,protocol:'Static'};
      })
    }));
    const links=(json.cables||[]).map((c,i)=>({id:c.id||('k'+i),
      a:{deviceId:c.fromId,ifId:c.fromPort},b:{deviceId:c.toId,ifId:c.toPort},
      type:c.type||'wired',speed:c.speed}));
    return {version:1,name:'Imported',devices,links};
  }
  return json;
}

// ═══════════════════════════════════════════════════════
// Application: Graph Builder
// ═══════════════════════════════════════════════════════
function ip2int(ip){const p=ip.split('.').map(Number);return (((p[0]<<24)|(p[1]<<16)|(p[2]<<8)|p[3])>>>0);}
function netOf(ip,prefix){
  const mask=prefix===0?0:((~0<<(32-prefix))>>>0);
  const n=ip2int(ip)&mask;
  return [n>>>24&255,n>>>16&255,n>>>8&255,n&255].join('.')+'/'+prefix;
}
function inNet(ip,cidr){const [,pfx]=cidr.split('/');return netOf(ip,+pfx)===cidr;}
function isPrivate(ip){
  const n=ip2int(ip);
  return (n>>>24===10)||((n>>>24===172)&&((n>>>16&255)>=16&&(n>>>16&255)<=31))||(n>>>16===0xC0A8);
}
function buildGraph(proj){
  const devMap={}; for(const d of proj.devices) devMap[d.id]=d;
  const ifOf=(dId,iId)=>(devMap[dId]?.interfaces||[]).find(i=>i.id===iId);
  const nets=new Map();
  for(const d of proj.devices) for(const i of d.interfaces||[]){
    if(!i.ip||i.prefix===undefined||i.prefix===null) continue;
    const cidr=netOf(i.ip,+i.prefix);
    if(!nets.has(cidr)) nets.set(cidr,{id:cidr,cidr,vlan:null,type:'lan',interfaces:[]});
    const n=nets.get(cidr);
    n.interfaces.push({deviceId:d.id,ifId:i.id});
    if(i.vlanId!=null&&n.vlan==null) n.vlan=i.vlanId;
    if(i.role==='wan'||!isPrivate(i.ip)) n.type='wan';
  }
  let ci=0; for(const n of nets.values()) n.color=NET_PALETTE[ci++%NET_PALETTE.length];
  const ipIndex={};
  for(const d of proj.devices) for(const i of d.interfaces||[]) if(i.ip) ipIndex[i.ip]={deviceId:d.id,ifId:i.id};
  const phys={}; for(const d of proj.devices) phys[d.id]=[];
  for(const l of proj.links||[]) if(devMap[l.a.deviceId]&&devMap[l.b.deviceId]){
    phys[l.a.deviceId].push(l.b.deviceId); phys[l.b.deviceId].push(l.a.deviceId);
  }
  return {devMap,ifOf,nets,ipIndex,phys};
}
function deviceNets(dev){
  const out=[];
  for(const i of dev.interfaces||[]) if(i.ip&&i.prefix!=null) out.push({cidr:netOf(i.ip,+i.prefix),iface:i});
  return out;
}

// ═══════════════════════════════════════════════════════
// Application: Layout Engine
// ═══════════════════════════════════════════════════════
function bfsLevels(proj,G){
  const order=['internet','onu','router','firewall','utm','l3sw','l2sw','ap','server','nas','pc','laptop','printer'];
  let root=null;
  for(const t of order){ root=proj.devices.find(d=>d.type===t); if(root) break; }
  if(!root) return {};
  const level={[root.id]:0}; const q=[root.id];
  while(q.length){ const c=q.shift();
    for(const nb of G.phys[c]||[]) if(level[nb]===undefined){ level[nb]=level[c]+1; q.push(nb); } }
  const typeLv={internet:0,onu:0,router:1,firewall:2,utm:2,l3sw:3,l2sw:4,ap:5,server:5,nas:5,pc:6,laptop:6,printer:6};
  for(const d of proj.devices) if(level[d.id]===undefined) level[d.id]=typeLv[d.type]??6;
  return level;
}
function levelLayout(proj,G,sizeFn){
  const level=bfsLevels(proj,G);
  const byLv={};
  for(const d of proj.devices)(byLv[level[d.id]]=byLv[level[d.id]]||[]).push(d);
  const keys=Object.keys(byLv).map(Number).sort((a,b)=>a-b);
  const GX=50,GY=85,W=1250;
  const pos={};let y=50;
  for(const k of keys){
    const devs=byLv[k];
    const sizes=devs.map(sizeFn);
    const totW=sizes.reduce((s,z)=>s+z.w,0)+(devs.length-1)*GX;
    let x=Math.max(30,(W-totW)/2),maxH=0;
    devs.forEach((d,i)=>{pos[d.id]={x,y,...sizes[i]};x+=sizes[i].w+GX;maxH=Math.max(maxH,sizes[i].h);});
    y+=maxH+GY;
  }
  return pos;
}

function runValidation(silent){
  const G=buildGraph(project);
  const issues=[];
  const seen={};
  for(const d of project.devices) for(const i of d.interfaces||[]){
    if(!i.ip) continue;
    if(seen[i.ip]) issues.push({lv:'err',msg:`IP重複: ${i.ip} — ${seen[i.ip].name} と ${d.name}/${i.name}`,devId:d.id});
    else seen[i.ip]={name:`${d.name}/${i.name}`,devId:d.id};
  }
  for(const d of project.devices) for(const i of d.interfaces||[]){
    if(!i.gateway) continue;
    if(!G.ipIndex[i.gateway]) issues.push({lv:'warn',msg:`Gateway不在: ${d.name}/${i.name} → ${i.gateway} を持つ機器がありません`,devId:d.id});
    else if(i.ip&&i.prefix!=null&&!inNet(i.gateway,netOf(i.ip,+i.prefix)))
      issues.push({lv:'err',msg:`Gateway不一致: ${d.name}/${i.name} (${i.ip}/${i.prefix}) と GW ${i.gateway} が別サブネット`,devId:d.id});
  }
  const usedPorts={};
  for(const l of project.links||[]){
    const ia=G.ifOf(l.a.deviceId,l.a.ifId), ib=G.ifOf(l.b.deviceId,l.b.ifId);
    if(!ia||!ib){ issues.push({lv:'err',msg:`リンク不正: ${l.id} の端点が存在しません`}); continue; }
    for(const end of [l.a,l.b]){
      const key=end.deviceId+'/'+end.ifId;
      if(usedPorts[key]) issues.push({lv:'err',msg:`Port重複: ${key} が複数リンクで使用されています`,devId:end.deviceId});
      usedPorts[key]=true;
    }
    if(ia.ip&&ib.ip&&ia.prefix!=null&&ib.prefix!=null&&netOf(ia.ip,+ia.prefix)!==netOf(ib.ip,+ib.prefix))
      issues.push({lv:'err',msg:`CIDR不一致: ${G.devMap[l.a.deviceId].name}/${ia.name} ↔ ${G.devMap[l.b.deviceId].name}/${ib.name}`,devId:l.a.deviceId});
    if(ia.role==='access'&&ib.role==='access'&&ia.vlanId!=null&&ib.vlanId!=null&&ia.vlanId!==ib.vlanId)
      issues.push({lv:'warn',msg:`VLAN不一致: ${G.devMap[l.a.deviceId].name}/${ia.name} (V${ia.vlanId}) ↔ ${G.devMap[l.b.deviceId].name}/${ib.name} (V${ib.vlanId})`,devId:l.a.deviceId});
  }
  const linked=new Set();
  for(const l of project.links||[]){ linked.add(l.a.deviceId+'/'+l.a.ifId); linked.add(l.b.deviceId+'/'+l.b.ifId); }
  for(const d of project.devices) for(const i of d.interfaces||[]){
    if(i.role==='svi') continue;
    if(!linked.has(d.id+'/'+i.id)) issues.push({lv:'info',msg:`未接続: ${d.name}/${i.name}`,devId:d.id});
  }
  // Unmanaged switch rules
  for(const d of project.devices){
    if(d.type!=='l2sw'||d.switchType!=='unmanaged') continue;
    for(const i of d.interfaces||[]){
      if(i.vlanId!=null||(i.allowedVlans||[]).length||i.role==='trunk')
        issues.push({lv:'err',msg:`VLAN設定不可: ${d.name}/${i.name} — アンマネージドスイッチはVLANを扱えません`,devId:d.id});
    }
    for(const l of project.links||[]){
      if(l.a.deviceId!==d.id&&l.b.deviceId!==d.id) continue;
      const other=l.a.deviceId===d.id?l.b:l.a;
      const oi=G.ifOf(other.deviceId,other.ifId);
      if(oi&&(oi.role==='trunk'||(oi.allowedVlans||[]).length))
        issues.push({lv:'err',msg:`トランク接続不可: ${G.devMap[other.deviceId]?.name}/${oi.name} (trunk) → ${d.name} はアンマネージドのためタグVLANを処理できません`,devId:d.id});
    }
  }
  lastValidation=issues;
  renderValidationPane();
  const errs=issues.filter(i=>i.lv==='err').length;
  const cnt=document.getElementById('vcnt');
  if(errs>0){ cnt.style.display='inline-block'; cnt.textContent=errs; } else cnt.style.display='none';
  if(!silent) log(errs?'err':'ok', errs?`検証: エラー ${errs} 件（Validationタブ参照）`:'検証OK — エラーはありません');
}
function renderValidationPane(){
  const el=document.getElementById('pane-validation');
  if(lastValidation.length===0){ el.innerHTML='<div class="empty-hint">問題は見つかりませんでした ✓</div>'; return; }
  const colors={err:'background:#7F1D1D;color:#FCA5A5',warn:'background:#78350F;color:#FCD34D',info:'background:#1E3A5F;color:#93C5FD'};
  const names={err:'ERROR',warn:'WARN',info:'INFO'};
  el.innerHTML=lastValidation.map((it,i)=>
    `<div class="vitem" onclick="jumpToIssue(${i})">
      <span class="vlv" style="${colors[it.lv]}">${names[it.lv]}</span>
      <span style="font-size:13.5px">${esc(it.msg)}</span>
    </div>`).join('');
}
function jumpToIssue(i){
  const it=lastValidation[i];
  if(!it?.devId) return;
  const dev=project.devices.find(d=>d.id===it.devId);
  if(!dev) return;
  selectedDev=it.devId; editIfIdx=null;
  if(view!=='physical'){ view='physical'; renderTabs(); }
  renderAll();
  const wrap=document.getElementById('canvasWrap');
  wrap.scrollTo({left:Math.max(0,dev.x*zoom-wrap.clientWidth/2+80), top:Math.max(0,dev.y*zoom-wrap.clientHeight/2+60), behavior:'smooth'});
}

function longestMatch(dev,ip){
  let best=null;
  for(const n of deviceNets(dev)) if(inNet(ip,n.cidr)){
    const p=+n.cidr.split('/')[1];
    if(!best||p>best.prefix) best={prefix:p,type:'connected',iface:n.iface};
  }
  for(const r of dev.routes||[]){
    const cidr=netOf(r.destination,+r.prefix);
    if(r.prefix===0||inNet(ip,cidr)){
      if(!best||+r.prefix>best.prefix) best={prefix:+r.prefix,type:'route',route:r};
    }
  }
  return best;
}
function runExplain(){
  const G=buildGraph(project);
  const fromId=document.getElementById('expFrom').value;
  const toId=document.getElementById('expTo').value;
  const src=G.devMap[fromId], dst=G.devMap[toId];
  const out=[];
  if(!src||!dst){ exSet('<div class="empty-hint">送信元と宛先を選択してください。</div>'); return; }
  const dstIf=selectedIface(dst.id,'expToIf');
  if(!dstIf){ exSet(`<div class="empty-hint">${esc(dst.name)} にIPアドレスがありません。</div>`); return; }
  const dstIp=dstIf.ip;
  const srcIf0=selectedIface(src.id,'expFromIf');
  out.push(`<div class="ex-card"><h4>経路: ${esc(src.name)}${srcIf0?' ('+esc(srcIf0.name)+' '+esc(srcIf0.ip)+')':''} → ${esc(dst.name)} (${esc(dstIf.name)} ${esc(dstIp)})</h4>`);
  let cur=src; const visited=new Set(); let hop=0; let body='';
  while(hop++<15){
    if(visited.has(cur.id)){ body+='<p style="color:var(--danger)">✗ ループを検出しました</p>'; break; }
    visited.add(cur.id);
    if(cur.id===dst.id){ body+='<p style="color:var(--ok)">✓ 宛先に到達しました</p>'; break; }
    const direct=deviceNets(cur).find(n=>inNet(dstIp,n.cidr));
    if(direct){
      body+=`<p><b style="color:var(--text)">${esc(cur.name)} → ${esc(dst.name)}</b><br><span style="font-size:13px">宛先 ${esc(dstIp)} は ${esc(direct.cidr)} 内なので直接到達（L2転送）</span></p>`;
      body+='<p style="color:var(--ok)">✓ 宛先に到達しました</p>';
      addLog('ROUTE',`${cur.name} → Directly Connected ${direct.cidr}`);
      addLog('SUCCESS','Destination reached');
      break;
    }
    let nextIp=null,why='';
    const m=longestMatch(cur,dstIp);
    if(m&&m.type==='route'){ nextIp=m.route.nextHop;
      why=m.route.prefix===0?`デフォルトルートに従い ${nextIp} へ転送`:`経路 ${m.route.destination}/${m.route.prefix} に従い ${nextIp} へ転送`;
    } else {
      const gwIf=(cur.interfaces||[]).find(i=>i.gateway);
      if(gwIf){ nextIp=gwIf.gateway; why=`宛先はネットワーク外なのでデフォルトゲートウェイ ${nextIp} へ転送`; }
    }
    if(!nextIp){ body+=`<p style="color:var(--danger)">✗ ${esc(cur.name)} に宛先への経路がありません</p>`; break; }
    const nh=G.ipIndex[nextIp];
    if(!nh){ body+=`<p style="color:var(--danger)">✗ ネクストホップ ${esc(nextIp)} を持つ機器が見つかりません</p>`; break; }
    const nhDev=G.devMap[nh.deviceId];
    body+=`<p><b style="color:var(--text)">${esc(cur.name)} → ${esc(nhDev.name)}</b> <span style="color:var(--text3)">(${esc(nextIp)})</span><br><span style="font-size:13px">${esc(why)}</span></p>`;
    addLog('ROUTE',`${cur.name} → ${nhDev.name} (${nextIp})  ${why}`);
    cur=nhDev;
  }
  out.push(body+'</div>');
  exSet(out.join(''));
  showBTab('explain');
}
function explainDevice(devId){
  const G=buildGraph(project);
  const d=G.devMap[devId]; if(!d) return;
  const s=DEV_TYPES[d.type]||DEV_TYPES.pc;
  const nets=deviceNets(d);
  let h=`<div class="ex-card"><h4><span class="badge" style="background:${s.border}">${s.tag}</span>${esc(d.name)}</h4>`;
  h+=`<p>${esc(ROLE_EXPLAIN[d.type]||'')}</p>`;
  if(nets.length) h+=`<p style="margin-top:8px"><b>所属ネットワーク:</b> ${nets.map(n=>esc(n.cidr)).join(', ')}</p>`;
  const gw=(d.interfaces||[]).find(i=>i.gateway);
  if(gw) h+=`<p><b>デフォルトゲートウェイ:</b> ${esc(gw.gateway)} — 宛先が自ネットワーク外のとき、まずここへ送ります。</p>`;
  if(d.routes?.length) h+=`<p><b>ルート:</b> ${d.routes.length}件保持（宛先ごとに転送先を決定します）</p>`;
  const lks=(project.links||[]).filter(l=>l.a.deviceId===d.id||l.b.deviceId===d.id);
  if(lks.length){
    h+=`<p><b>物理接続:</b> `+lks.map(l=>{
      const other=l.a.deviceId===d.id?l.b:l.a;
      return esc(G.devMap[other.deviceId]?.name||'?')+' ('+esc(other.ifId)+')';
    }).join(' / ')+'</p>';
  }
  h+='</div>';
  exSet(h); showBTab('explain');
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const NS_SVG='http://www.w3.org/2000/svg';
// measure real text width via a hidden SVG text node (cached)
let _measSvg=null,_measTxt=null;
const _measCache=new Map();
function textWidth(str,fontSize,weight){
  const key=fontSize+'|'+(weight||'')+'|'+str;
  if(_measCache.has(key)) return _measCache.get(key);
  if(!_measSvg){
    _measSvg=document.createElementNS(NS_SVG,'svg');
    _measSvg.setAttribute('style','position:absolute;width:0;height:0;overflow:hidden;visibility:hidden');
    _measTxt=document.createElementNS(NS_SVG,'text');
    _measSvg.appendChild(_measTxt); document.body.appendChild(_measSvg);
  }
  _measTxt.setAttribute('font-size',fontSize);
  _measTxt.setAttribute('font-weight',weight||'400');
  _measTxt.setAttribute('font-family',"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif");
  _measTxt.textContent=str;
  let w=0;
  try{ w=_measTxt.getComputedTextLength(); }catch(e){ w=0; }
  if(!w){ // headless fallback: CJK≈1em, latin≈0.55em
    for(const c of str) w+=c.charCodeAt(0)>255?fontSize:fontSize*0.55;
  }
  _measCache.set(key,w);
  return w;
}
// shrink text to fit maxW; returns {text,size}
function fitLabel(str,maxW,size,minSize,weight){
  let s=size;
  while(s>minSize&&textWidth(str,s,weight)>maxW) s-=0.5;
  if(textWidth(str,s,weight)<=maxW) return {text:str,size:s};
  let t=str;
  while(t.length>1&&textWidth(t+'…',s,weight)>maxW) t=t.slice(0,-1);
  return {text:t+'…',size:s};
}

// ── 折れ線を角丸のパスに変換（直角の硬さを和らげる） ──
function roundedPath(pts,r){
  if(!pts||pts.length<2) return '';
  if(pts.length===2) return `M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]}`;
  const R=r??14;
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const P=pts[i-1], C=pts[i], N=pts[i+1];
    const l1=Math.hypot(C[0]-P[0],C[1]-P[1]);
    const l2=Math.hypot(N[0]-C[0],N[1]-C[1]);
    const rr=Math.min(R,l1/2,l2/2);
    if(rr<1.2){ d+=` L${C[0]},${C[1]}`; continue; }
    const a=[C[0]+(P[0]-C[0])/l1*rr, C[1]+(P[1]-C[1])/l1*rr];
    const b=[C[0]+(N[0]-C[0])/l2*rr, C[1]+(N[1]-C[1])/l2*rr];
    d+=` L${a[0].toFixed(1)},${a[1].toFixed(1)} Q${C[0]},${C[1]} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
  }
  const E=pts[pts.length-1];
  d+=` L${E[0]},${E[1]}`;
  return d;
}

// ── 折れ線の全長 f (0..1) 地点を返す（ラベル配置用） ──
function pointAtFraction(pts,f){
  let total=0; const seg=[];
  for(let i=0;i<pts.length-1;i++){
    const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);
    seg.push(d); total+=d;
  }
  if(total===0) return {x:pts[0][0],y:pts[0][1],vertical:false};
  let want=total*f;
  for(let i=0;i<seg.length;i++){
    if(want<=seg[i]||i===seg.length-1){
      const t=seg[i]?want/seg[i]:0;
      const x=pts[i][0]+(pts[i+1][0]-pts[i][0])*t;
      const y=pts[i][1]+(pts[i+1][1]-pts[i][1])*t;
      const vertical=Math.abs(pts[i+1][1]-pts[i][1])>Math.abs(pts[i+1][0]-pts[i][0]);
      return {x,y,vertical};
    }
    want-=seg[i];
  }
  return {x:pts[0][0],y:pts[0][1],vertical:false};
}

// ── 直交ルーター: 空きコリドーを探索して決定的に経路を決める ──
function segFree(x1,y1,x2,y2,boxes,pad){
  const P=pad??8;
  const lo=v=>Math.min(v[0],v[1]), hi=v=>Math.max(v[0],v[1]);
  for(const b of boxes){
    const bx0=b.x-P,by0=b.y-P,bx1=b.x+b.w+P,by1=b.y+b.h+P;
    if(Math.abs(y1-y2)<0.5){            // 水平
      if(y1>by0&&y1<by1&&hi([x1,x2])>bx0&&lo([x1,x2])<bx1) return false;
    } else if(Math.abs(x1-x2)<0.5){     // 垂直
      if(x1>bx0&&x1<bx1&&hi([y1,y2])>by0&&lo([y1,y2])<by1) return false;
    }
  }
  return true;
}
function pathFree(pts,boxes,pad){
  for(let i=0;i<pts.length-1;i++)
    if(!segFree(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],boxes,pad)) return false;
  return true;
}
// 経路コスト: 総距離 + 折れ回数ペナルティ + 逆走ペナルティ
function pathCost(pts,a2,b2){
  let len=0,bends=0;
  for(let i=0;i<pts.length-1;i++){
    len+=Math.abs(pts[i+1][0]-pts[i][0])+Math.abs(pts[i+1][1]-pts[i][1]);
    if(i>0){
      const p=[pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]];
      const n=[pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]];
      if((Math.abs(p[0])>0.5)!==(Math.abs(n[0])>0.5)) bends++;
    }
  }
  // 直線距離との差＝遠回り量。折れ数と併せて評価
  const manhattan=Math.abs(b2[0]-a2[0])+Math.abs(b2[1]-a2[1]);
  return (len-manhattan)*1.0 + bends*26;
}
// a2/b2 を結ぶ Z 経路（水平コリドー y を探索）— 最小コストの候補を返す
function routeViaHCorridor(a2,b2,boxes,preferY,span){
  const lo=Math.min(a2[1],b2[1]), hi=Math.max(a2[1],b2[1]);
  const cands=[preferY];
  // 端点の間（＝遠回りしない範囲）を優先し、その後に外側へ広げる
  for(let k=1;k<=14;k++){ cands.push(preferY+k*12, preferY-k*12); }
  const inside=cands.filter(y=>y>=lo-1&&y<=hi+1), outside=cands.filter(y=>y<lo-1||y>hi+1);
  let best=null,bestC=Infinity;
  for(const list of [inside,outside]){
    for(const y of list){
      if(span&&(y<span[0]||y>span[1])) continue;
      const pts=[a2,[a2[0],y],[b2[0],y],b2];
      if(!pathFree(pts,boxes)) continue;
      const c=pathCost(pts,a2,b2);
      if(c<bestC){bestC=c;best=pts;}
    }
    if(best) return best;   // 内側で見つかれば外側は探さない
  }
  return best;
}
// a2/b2 を結ぶ Z 経路（垂直コリドー x を探索）
function routeViaVCorridor(a2,b2,boxes,preferX){
  const lo=Math.min(a2[0],b2[0]), hi=Math.max(a2[0],b2[0]);
  const cands=[preferX];
  for(let k=1;k<=14;k++){ cands.push(preferX+k*12, preferX-k*12); }
  const inside=cands.filter(x=>x>=lo-1&&x<=hi+1), outside=cands.filter(x=>x<lo-1||x>hi+1);
  let best=null,bestC=Infinity;
  for(const list of [inside,outside]){
    for(const x of list){
      const pts=[a2,[x,a2[1]],[x,b2[1]],b2];
      if(!pathFree(pts,boxes)) continue;
      const c=pathCost(pts,a2,b2);
      if(c<bestC){bestC=c;best=pts;}
    }
    if(best) return best;
  }
  return best;
}

// ── 共通: 直交経路の障害物回避（全ビューで使用） ──
function avoidBoxes(pts,boxes,pad){
  const PAD=pad??10;
  if(!boxes||!boxes.length) return pts;
  let res=pts;
  for(let it=0;it<6;it++){
    let changed=false; const out=[res[0]];
    for(let i=0;i<res.length-1;i++){
      const [ax,ay]=res[i],[bx,by]=res[i+1];
      const isH=Math.abs(ay-by)<0.5, isV=Math.abs(ax-bx)<0.5;
      let blk=null;
      if(isH||isV) for(const b of boxes){
        const x0=b.x-PAD,y0=b.y-PAD,x1=b.x+b.w+PAD,y1=b.y+b.h+PAD;
        if(isH){const lo=Math.min(ax,bx),hi=Math.max(ax,bx);
          if(ay>y0&&ay<y1&&hi>x0&&lo<x1){blk={x0,y0,x1,y1};break;}}
        else{const lo=Math.min(ay,by),hi=Math.max(ay,by);
          if(ax>x0&&ax<x1&&hi>y0&&lo<y1){blk={x0,y0,x1,y1};break;}}
      }
      if(blk){changed=true;
        if(isH){const dY=(ay-blk.y0<=blk.y1-ay)?blk.y0-2:blk.y1+2; out.push([ax,dY],[bx,dY]);}
        else{const dX=(ax-blk.x0<=blk.x1-ax)?blk.x0-2:blk.x1+2; out.push([dX,ay],[dX,by]);}
      }
      out.push([bx,by]);
    }
    res=out; if(!changed) break;
  }
  return res;
}
// ポート表記: physical view は「Port 1」のような自然な表記に統一する
function portDisplayName(i){
  const n=String(i.name||i.id||'');
  // Port1 / port 1 / Gi0/1 / Te1/0/2 → Port N
  let m=n.match(/^(?:Port|port)\s*([0-9][0-9./]*)$/);
  if(m) return 'Port '+m[1];
  m=n.match(/^(?:Gi|Te|Fa|Eth|eth)\s*([0-9][0-9./]*)$/i);
  if(m){ const num=m[1].replace(/^\d+\/\d+\//,''); return 'Port '+num; }
  // WAN / LAN1 / eth0 / wlan0 などはそのまま（すでに意味が明確）
  return n;
}

// Presentation: Physical View (editor)

// ── 実機に近いフェイスプレート表現 ──
// ポートは基本「横1列」。1列で収まらない数のときだけ2列（＝2段）に折り返す。
const DEVW_MIN=220;
const HEAD_H=46;                 // ヘッダー（アイコン/機器名/型番）
const PW=52, PH=22, PGAP=6;      // ポート方形（Port 1 が入る幅）
const PAD_X=10, PAD_B=12;
const MAX_PER_ROW=12;            // 1段に並べる上限（超えたら2段）
function portGrid(d){
  const n=(d.interfaces?.length||0);
  const rows=n>MAX_PER_ROW?2:1;                 // 基本1段、多いときだけ2段
  const perRow=Math.ceil(n/rows)||1;
  return {rows, perRow};
}
// 機器幅はポート数に応じて可変（1列配置を優先するため）
function devBoxW(d){
  const {perRow}=portGrid(d);
  return Math.max(DEVW_MIN, PAD_X*2+perRow*PW+(perRow-1)*PGAP);
}
function devBoxH(d){
  const {rows}=portGrid(d);
  return HEAD_H+rows*(PH+PGAP)+PAD_B;
}
// ポート方形の矩形（機器内部）— 左上から行優先で番号順に並ぶ
function portCell(d,idx){
  const {perRow}=portGrid(d);
  const r=Math.floor(idx/perRow), c=idx%perRow;
  return {x:d.x+PAD_X+c*(PW+PGAP), y:d.y+HEAD_H+r*(PH+PGAP), w:PW, h:PH, row:r, col:c};
}
function rectsNear(a,b,gap){return a.x<b.x+b.w+gap&&b.x<a.x+a.w+gap&&a.y<b.y+b.h+gap&&b.y<a.y+a.h+gap;}
// 実際に重なった場合のみ、最小移動量で押し出す（近接配置は許容）
function resolveOverlap(dev){
  let moved=false;
  for(let it=0;it<12;it++){
    const me={x:dev.x,y:dev.y,w:devBoxW(dev),h:devBoxH(dev)};
    // gap=0 → 本当に矩形が交差しているときだけ対象
    const other=project.devices.find(o=>o.id!==dev.id&&rectsNear(me,{x:o.x,y:o.y,w:devBoxW(o),h:devBoxH(o)},0));
    if(!other) break;
    const ob={x:other.x,y:other.y,w:devBoxW(other),h:devBoxH(other)};
    // 4方向の押し出し量を求め、最小の方向へ最小距離だけ動かす
    const pushR=ob.x+ob.w-me.x, pushL=me.x+me.w-ob.x;
    const pushD=ob.y+ob.h-me.y, pushU=me.y+me.h-ob.y;
    const m=Math.min(pushR,pushL,pushD,pushU);
    const M=2; // 触れた状態で止めないための最小マージン
    // グリッド丸めで再び重ならないよう、押し出す向きへ切り上げ/切り下げする
    if(m===pushR)      dev.x=Math.ceil ((dev.x+pushR+M)/10)*10;
    else if(m===pushL) dev.x=Math.floor((dev.x-pushL-M)/10)*10;
    else if(m===pushD) dev.y=Math.ceil ((dev.y+pushD+M)/10)*10;
    else               dev.y=Math.floor((dev.y-pushU-M)/10)*10;
    dev.x=Math.max(0,dev.x); dev.y=Math.max(0,dev.y);
    moved=true;
  }
  return moved;
}
function portPoint(d,idx){ const c=portCell(d,idx); return {x:c.x+c.w/2, y:c.y+c.h/2}; }

function renderPhysical(){
  const wrap=document.getElementById('canvasWrap');
  wrap.classList.add('diagram');
  const G=buildGraph(project);
  let mw=1000,mh=700;
  for(const d of project.devices){ mw=Math.max(mw,d.x+devBoxW(d)+100); mh=Math.max(mh,d.y+devBoxH(d)+100); }
  const p=[];
  p.push(`<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" width="${mw}" height="${mh}" viewBox="0 0 ${mw} ${mh}" preserveAspectRatio="xMinYMin meet" id="physSvg">`);
  p.push(`<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="1"/></pattern></defs>`);
  p.push(`<rect width="${mw}" height="${mh}" fill="#F8FAFC" data-bg="1"/>`);
  p.push(`<rect width="${mw}" height="${mh}" fill="url(#grid)" data-bg="1"/>`);

  // Subnet group frames (endpoints belonging to exactly one LAN subnet) — collapsible
  const hiddenDevNet={}; // devId -> cidr (collapsed)
  const groupBox={};     // cidr -> {x,y,w,h}
  for(const net of G.nets.values()){
    if(net.type!=='lan') continue;
    const memberIds=[...new Set(net.interfaces.map(m=>m.deviceId))]
      .filter(id=>{const d=G.devMap[id];return d&&deviceNets(d).length===1;});
    if(memberIds.length<1) continue;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const id of memberIds){const d=G.devMap[id];
      x0=Math.min(x0,d.x);y0=Math.min(y0,d.y);
      x1=Math.max(x1,d.x+devBoxW(d));y1=Math.max(y1,d.y+devBoxH(d));}
    const P=16;
    const collapsed=collapsedNets.has(net.cidr);
    const lbl=`${collapsed?'▸':'▾'} ${net.cidr}${net.vlan!=null?'  VLAN'+net.vlan:''}${collapsed?'  ['+memberIds.length+'台]':''}`;
    if(collapsed){
      for(const id of memberIds) hiddenDevNet[id]=net.cidr;
      const gw2=200,gh=52;
      groupBox[net.cidr]={x:x0-P,y:y0-P,w:gw2,h:gh};
      p.push(`<rect x="${x0-P}" y="${y0-P}" width="${gw2}" height="${gh}" rx="10" fill="${net.color}" fill-opacity="0.12" stroke="${net.color}" stroke-width="2"/>`);
      p.push(`<text x="${x0-P+14}" y="${y0-P+30}" font-size="11" fill="${net.color}" font-weight="700" font-family="'SF Mono',Menlo,monospace" class="net-label" onclick="toggleNetCollapse('${esc(net.cidr)}')">${esc(lbl)}</text>`);
    } else {
      p.push(`<rect x="${x0-P}" y="${y0-P-18}" width="${x1-x0+P*2}" height="${y1-y0+P*2+18}" rx="12"
        fill="${net.color}" fill-opacity="0.05" stroke="${net.color}" stroke-width="1.5" stroke-dasharray="7,4" pointer-events="none"/>`);
      p.push(`<rect x="${x0-P+6}" y="${y0-P-26}" width="${lbl.length*6.4+14}" height="16" rx="4" fill="${net.color}" class="net-label" onclick="toggleNetCollapse('${esc(net.cidr)}')"/>`);
      p.push(`<text x="${x0-P+13}" y="${y0-P-14.5}" font-size="9.5" fill="white" font-weight="700" font-family="'SF Mono',Menlo,monospace" class="net-label" onclick="toggleNetCollapse('${esc(net.cidr)}')">${esc(lbl)}</text>`);
    }
  }

  // Obstacle boxes for cable routing (visible devices only)
  const obstacles=project.devices.filter(d=>!hiddenDevNet[d.id])
    .map(d=>({id:d.id,x:d.x,y:d.y,w:devBoxW(d),h:devBoxH(d)}));
  const routeAvoid=(pts,skipIds)=>avoidBoxes(pts,obstacles.filter(b=>!skipIds.includes(b.id)));

  // Per-port exit edge (4方向): face the connected peer to avoid backtracking
  const edgeAssign={};  // devId -> ifId -> 'L'|'R'|'T'|'B'
  const peerCX={};      // devId -> ifId -> peer center x (for edge-slot ordering)
  for(const d of project.devices){ edgeAssign[d.id]={}; peerCX[d.id]={}; }
  const centerOf=d=>({x:d.x+devBoxW(d)/2, y:d.y+devBoxH(d)/2});
  for(const l of project.links||[]){
    const da=G.devMap[l.a.deviceId], db=G.devMap[l.b.deviceId];
    if(!da||!db) continue;
    const ca=centerOf(da), cb=centerOf(db);
    const dx=cb.x-ca.x, dy=cb.y-ca.y;
    // 物理図では原則「下側から出す」。真横に大きく離れている場合のみ左右を使う。
    // （上側は機器名やヘッダーと干渉するため使わない）
    const strongH=Math.abs(dx)>Math.abs(dy)*2.2;
    let eA,eB;
    if(strongH){ eA=dx>0?'R':'L'; eB=dx>0?'L':'R'; }
    else{
      eA='B';                       // 送出は常に下から
      eB=dy>0?'T':'B';              // 相手が下にいれば上面で受ける／上にいれば相手も下から
    }
    edgeAssign[l.a.deviceId][l.a.ifId]=eA; peerCX[l.a.deviceId][l.a.ifId]=cb.x;
    edgeAssign[l.b.deviceId][l.b.ifId]=eB; peerCX[l.b.deviceId][l.b.ifId]=ca.x;
  }
  // ポート方形は機器内部（フェイスプレート）に配置し、
  // ケーブルはポート方形 → 機器の辺 → 外部 という順に引く
  // anchorOf: {cell: ポート方形の矩形, x,y: 機器の辺上の接続点, dx,dy: 進行方向}
  const anchorOf={};
  for(const d of project.devices){
    if(hiddenDevNet[d.id]) continue;
    anchorOf[d.id]={};
    const h=devBoxH(d);
    (d.interfaces||[]).forEach((i,idx)=>{
      const e=edgeAssign[d.id][i.id]||'R';
      const cell=portCell(d,idx);
      const cx0=cell.x+cell.w/2, cy0=cell.y+cell.h/2;
      let x,y,dx=0,dy=0;
      if(e==='L'){ x=d.x;        y=cy0; dx=-1; }
      else if(e==='R'){ x=d.x+devBoxW(d); y=cy0; dx=1; }
      else if(e==='T'){ x=cx0; y=d.y;      dy=-1; }
      else { x=cx0; y=d.y+h; dy=1; }
      anchorOf[d.id][i.id]={cell,x,y,dx,dy,cx0,cy0};
    });
  }
  const sideOf=(devId,ifId)=>edgeAssign[devId]?.[ifId]||'R';

  const ptOf=(end)=>{
    const d=G.devMap[end.deviceId]; if(!d) return null;
    if(hiddenDevNet[d.id]){
      const gb=groupBox[hiddenDevNet[d.id]];
      return gb?{x:gb.x+gb.w,y:gb.y+gb.h/2,dx:1,dy:0,grouped:true}:null;
    }
    return anchorOf[end.deviceId]?.[end.ifId]||null;
  };
  const portLinkColor={};   // devId -> ifId -> ケーブル色（ポート方形ラベルの強調に使用）
  const ifColor=i=>{
    if(!i) return null;
    if(i.ip&&i.prefix!=null){const n=G.nets.get(netOf(i.ip,+i.prefix));if(n)return n.color;}
    if(i.vlanId!=null){for(const n of G.nets.values())if(n.vlan===i.vlanId)return n.color;}
    return null;
  };
  // ── レーン割り当て: 同じ通路を通るリンクを揃えて平行化する ──
  const drawList=[];
  for(const l of project.links||[]){
    if(hiddenDevNet[l.a.deviceId]&&hiddenDevNet[l.a.deviceId]===hiddenDevNet[l.b.deviceId]) continue;
    const pa=ptOf(l.a), pb=ptOf(l.b);
    if(!pa||!pb) continue;
    const aH=!!pa.dx, bH=!!pb.dx;
    const kind=(aH===bH)?(aH?'H':'V'):'L';   // H:横→横 V:縦→縦 L:L字
    // 通路キー: 縦経路なら「渡る帯のY」、横経路なら「渡る帯のX」を50px単位で丸める
    const corridor = kind==='V' ? 'V'+Math.round((pa.y+pb.y)/2/50)
                   : kind==='H' ? 'H'+Math.round((pa.x+pb.x)/2/50)
                   : 'L'+Math.round(pa.x/60)+'_'+Math.round(pb.y/60);
    drawList.push({l,pa,pb,aH,bH,kind,corridor});
  }
  // 通路ごとに、進行方向に沿ってソートしてレーン番号を振る
  const laneOf=new Map();
  const byCorridor={};
  for(const it of drawList)(byCorridor[it.corridor]=byCorridor[it.corridor]||[]).push(it);
  for(const key in byCorridor){
    const g=byCorridor[key];
    g.sort((A,B)=> A.kind==='V' ? (A.pa.x-B.pa.x) : (A.pa.y-B.pa.y));
    g.forEach((it,i)=>laneOf.set(it.l.id, i-(g.length-1)/2));
  }

  drawList.forEach(({l,pa,pb,aH,bH,kind})=>{
    const wl=l.type==='wireless';
    const ia=G.ifOf(l.a.deviceId,l.a.ifId), ib=G.ifOf(l.b.deviceId,l.b.ifId);
    const lc=wl?'#84CC16':(ifColor(ia)||ifColor(ib)||'#475569');
    const lane=laneOf.get(l.id)||0;
    const MAG=26;                    // スタブ長は一定（ばらつきによる不自然な折れを排除）
    const LANE=11;                   // レーン間隔
    const off=routeOff('physical',l.id);
    // stub points beyond each edge
    const pa2=[pa.x+(pa.dx||0)*MAG, pa.y+(pa.dy||0)*MAG];
    const pb2=[pb.x+(pb.dx||0)*MAG, pb.y+(pb.dy||0)*MAG];
    // 自機器のポート方形と本体は障害物から除外（ここから出るため）
    const boxes=obstacles.filter(b=>b.id!==l.a.deviceId&&b.id!==l.b.deviceId);
    // 候補経路をすべて集め、遠回り量＋折れ数が最小のものを採用
    const midY=(pa2[1]+pb2[1])/2+lane*LANE+off.dy;
    const midX=(pa2[0]+pb2[0])/2+lane*LANE+off.dx;
    const cands=[];
    // 1) 直線（同一軸上に並んでいる場合の最短）
    if(Math.abs(pa2[0]-pb2[0])<1.5||Math.abs(pa2[1]-pb2[1])<1.5){
      const st=[pa2,pb2];
      if(pathFree(st,boxes)) cands.push(st);
    }
    // 2) L字（1回折れ）— 出口方向と整合する方を優先評価
    for(const e of [[pa2,[pa2[0],pb2[1]],pb2],[pa2,[pb2[0],pa2[1]],pb2]])
      if(pathFree(e,boxes)) cands.push(e);
    // 3) Z字（コリドー探索）
    const zh=routeViaHCorridor(pa2,pb2,boxes,midY); if(zh) cands.push(zh);
    const zv=routeViaVCorridor(pa2,pb2,boxes,midX); if(zv) cands.push(zv);
    let core=null,bestC=Infinity;
    for(const c of cands){
      let cost=pathCost(c,pa2,pb2);
      // 出口方向と最初の一歩が逆向きなら強くペナルティ（＝不自然な折り返し防止）
      const step=[c[1][0]-c[0][0], c[1][1]-c[0][1]];
      if((pa.dx&&Math.sign(step[0])===-Math.sign(pa.dx))||
         (pa.dy&&Math.sign(step[1])===-Math.sign(pa.dy))) cost+=180;
      // レーン指定の帯に近いほど僅かに優遇（並走の整列を保つ）
      if(kind==='V') cost+=Math.abs(pointAtFraction(c,0.5).y-midY)*0.05;
      if(kind==='H') cost+=Math.abs(pointAtFraction(c,0.5).x-midX)*0.05;
      if(cost<bestC){bestC=cost;core=c;}
    }
    if(!core){ // どうしても空きがなければ単純Z（描画は必ず行う）
      core=(kind==='H')
        ? [pa2,[midX,pa2[1]],[midX,pb2[1]],pb2]
        : [pa2,[pa2[0],midY],[pb2[0],midY],pb2];
    }
    let pts=[[pa.x,pa.y],...core,[pb.x,pb.y]];
    // drop duplicate consecutive points
    pts=pts.filter((q,i)=>i===0||Math.abs(q[0]-pts[i-1][0])>0.1||Math.abs(q[1]-pts[i-1][1])>0.1);
    const d='M'+pts.map(q=>q.join(',')).join(' L');
    const isSel=selectedLink===l.id;
    p.push(`<path d="${d}" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/>`);
    if(isSel) p.push(`<path d="${d}" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linejoin="round" opacity=".45" pointer-events="none"/>`);
    p.push(`<path d="${d}" data-link="${esc(l.id)}" data-cable="${esc(l.id)}" fill="none" stroke="${lc}" stroke-width="${isSel?3.4:2.4}" ${wl?'stroke-dasharray="6,4"':''} stroke-linejoin="round"><title>${esc((G.devMap[l.a.deviceId]?.name||'')+'/'+l.a.ifId+' ↔ '+(G.devMap[l.b.deviceId]?.name||'')+'/'+l.b.ifId+(l.speed?'  '+l.speed:''))}</title></path>`);
    if(isSel){
      // 中点に削除ボタン
      const mp=pointAtFraction(pts,0.5);
      p.push(`<g data-delcable="${esc(l.id)}" style="cursor:pointer">
        <circle cx="${mp.x}" cy="${mp.y}" r="10" fill="#EF4444" stroke="white" stroke-width="2"/>
        <path d="M${mp.x-4},${mp.y-4} L${mp.x+4},${mp.y+4} M${mp.x+4},${mp.y-4} L${mp.x-4},${mp.y+4}" stroke="white" stroke-width="2" stroke-linecap="round" pointer-events="none"/>
      </g>`);
    }
    // ポート方形ラベルの色を記録（後段のポート描画で使用）
    portLinkColor[l.a.deviceId]=portLinkColor[l.a.deviceId]||{};
    portLinkColor[l.b.deviceId]=portLinkColor[l.b.deviceId]||{};
    portLinkColor[l.a.deviceId][l.a.ifId]=lc;
    portLinkColor[l.b.deviceId][l.b.ifId]=lc;
    if(l.speed){
      // 経路の中間点（全長の50%）に配置し、両端のポートチップから離す
      const mid=pointAtFraction(pts,0.5);
      const CLEAR=34; // 端点から最低これだけ離す
      const dEnd=Math.min(Math.hypot(mid.x-pa.x,mid.y-pa.y),Math.hypot(mid.x-pb.x,mid.y-pb.y));
      if(dEnd>=CLEAR){
        const fit=fitLabel(String(l.speed),56,8,6.5,'600');
        const w=textWidth(fit.text,fit.size,'600')+9, h=12;
        // 線が縦なら右側、横なら上側へオフセット
        const lx=mid.vertical?mid.x+6:mid.x-w/2;
        const ly=mid.vertical?mid.y-h/2:mid.y-h-3;
        p.push(`<rect x="${lx}" y="${ly}" width="${w}" height="${h}" rx="3" fill="white" fill-opacity=".92" pointer-events="none"/>`);
        p.push(`<text x="${lx+w/2}" y="${ly+h-3.4}" font-size="${fit.size}" fill="#64748B" font-weight="600" text-anchor="middle" pointer-events="none">${esc(fit.text)}</text>`);
      }
    }
  });
  for(const d of project.devices){
    if(hiddenDevNet[d.id]) continue; // inside collapsed group
    const s=DEV_TYPES[d.type]||DEV_TYPES.pc;
    const h=devBoxH(d), W=devBoxW(d);
    const sel=selectedDev===d.id;
    p.push(`<g class="dev-g" data-dev="${esc(d.id)}">`);
    // 筐体
    p.push(`<rect x="${d.x}" y="${d.y}" width="${W}" height="${h}" rx="8" fill="#FFFFFF" stroke="${sel?'#3B82F6':s.border}" stroke-width="${sel?3:1.8}"/>`);
    // ヘッダー（機器種別カラー）
    p.push(`<rect x="${d.x}" y="${d.y}" width="${W}" height="26" rx="8" fill="${s.border}"/>`);
    p.push(`<rect x="${d.x}" y="${d.y+16}" width="${W}" height="10" fill="${s.border}"/>`);
    p.push(devIcon(d.type, d.x+8, d.y+5, 16, 'white'));
    p.push(`<text x="${d.x+30}" y="${d.y+17.5}" font-size="10.5" fill="white" font-weight="700">${esc(fitText(d.name,W-40,10.5))}</text>`);
    // 型番（1行だけ、控えめに）
    const modelTxt=[d.manufacturer,d.model].filter(Boolean).join(' ');
    if(modelTxt) p.push(`<text x="${d.x+PAD_X}" y="${d.y+38}" font-size="8" fill="#94A3B8">${esc(fitText(modelTxt,W-PAD_X*2,8))}</text>`);
    // フェイスプレート下地
    const {rows}=portGrid(d);
    p.push(`<rect x="${d.x+PAD_X-4}" y="${d.y+HEAD_H-4}" width="${W-(PAD_X-4)*2}" height="${rows*(PH+PGAP)-PGAP+8}" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width=".8" pointer-events="none"/>`);
    // ポート方形（機器内部）
    (d.interfaces||[]).forEach((i,idx)=>{
      const c=portCell(d,idx);
      const anc=anchorOf[d.id]?.[i.id];
      const linked=(project.links||[]).some(l=>
        (l.a.deviceId===d.id&&l.a.ifId===i.id)||(l.b.deviceId===d.id&&l.b.ifId===i.id));
      const isFirst=linkFirst&&linkFirst.deviceId===d.id&&linkFirst.ifId===i.id;
      const cableC=portLinkColor[d.id]?.[i.id];
      const fill   = isFirst?'#F59E0B':(linked?(cableC||'#16A34A'):'#FFFFFF');
      const stroke = isFirst?'#B45309':(linked?(cableC||'#16A34A'):'#94A3B8');
      const txtC   = (isFirst||linked)?'#FFFFFF':'#64748B';
      // ポート → 機器の辺 への内部リード線
      if(anc&&linked)
        p.push(`<line x1="${anc.cx0}" y1="${anc.cy0}" x2="${anc.x}" y2="${anc.y}" stroke="${cableC||'#16A34A'}" stroke-width="1.6" opacity=".55" pointer-events="none"/>`);
      const fit=fitLabel(portDisplayName(i),PW-7,8,6.5,'700');
      p.push(`<g class="port-c${linked?' used':''}" data-dev="${esc(d.id)}" data-if="${esc(i.id)}">`);
      p.push(`<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="2.5" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>`);
      p.push(`<text x="${c.x+c.w/2}" y="${c.y+c.h/2+2.8}" font-size="${fit.size}" fill="${txtC}" font-weight="700" text-anchor="middle" pointer-events="none">${esc(fit.text)}</text>`);
      // VLANの極小マーカー（色のみ・文字なし）
      if(i.vlanId!=null){
        const vc=(()=>{for(const n of G.nets.values())if(n.vlan===i.vlanId)return n.color;return '#94A3B8';})();
        p.push(`<rect x="${c.x}" y="${c.y+c.h-2.6}" width="${c.w}" height="2.6" rx="1" fill="${vc}" pointer-events="none"/>`);
      }
      p.push('</g>');
    });
    p.push('</g>');
  }
  p.push('</svg>');
  wrap.innerHTML=p.join('');
  applyZoom();
  attachPhysicalEvents();
  attachCableDrag('physical');
  attachCableHover();
}
// ── 機器ホバー時の詳細パネル（通常表示はすっきり、必要時のみ詳細） ──
function showDevTip(devId,ev){
  const tip=document.getElementById('devTip');
  const d=project.devices.find(x=>x.id===devId);
  if(!tip||!d){ hideDevTip(); return; }
  const G=buildGraph(project);
  const s=DEV_TYPES[d.type]||DEV_TYPES.pc;
  const vlanColor=v=>{for(const n of G.nets.values())if(n.vlan===v)return n.color;return '#94A3B8';};
  const rows=(d.interfaces||[]).map(i=>{
    const peer=(project.links||[]).find(l=>
      (l.a.deviceId===d.id&&l.a.ifId===i.id)||(l.b.deviceId===d.id&&l.b.ifId===i.id));
    let peerTxt='—';
    if(peer){
      const o=peer.a.deviceId===d.id?peer.b:peer.a;
      peerTxt=`${G.devMap[o.deviceId]?.name||o.deviceId} / ${o.ifId}`;
    }
    const vl=i.vlanId!=null?`<span class="vchip" style="background:${vlanColor(i.vlanId)}">VLAN ${i.vlanId}</span>`
      :((i.allowedVlans||[]).length?`<span style="color:#A78BFA;font-weight:700">T[${i.allowedVlans.join(',')}]</span>`:'—');
    return `<tr><td class="nm">${esc(i.name)}</td><td>${esc(i.ip?i.ip+'/'+(i.prefix??''):'—')}</td>
      <td>${vl}</td><td style="font-family:inherit;color:var(--text2)">${esc(peerTxt)}</td></tr>`;
  }).join('');
  const meta=[];
  if(d.hostname) meta.push('host: '+d.hostname);
  if(d.switchType) meta.push(d.switchType==='unmanaged'?'アンマネージド':'スマートSW');
  if(d.stp?.enabled) meta.push(`STP ${d.stp.mode||'RSTP'} (pri ${d.stp.priority??32768})`);
  if(d.nat?.mode&&d.nat.mode!=='none') meta.push('NAT '+d.nat.mode.toUpperCase());
  if(d.routes?.length) meta.push(`ルート ${d.routes.length}件`);
  if((d.ssids||[]).length) meta.push('SSID: '+d.ssids.map(x=>x.name).join(', '));
  tip.innerHTML=`<div class="ttwrap"><div class="tt"><span class="badge" style="background:${s.border}">${s.tag}</span>${esc(d.name)}</div>
    <div class="tsub">${esc([d.manufacturer,d.model].filter(Boolean).join(' ')||'—')}</div>
    <table><tr><th>Port</th><th>IP</th><th>VLAN</th><th>接続先</th></tr>${rows}</table>
    ${meta.length?`<div class="meta">${esc(meta.join('  ／  '))}</div>`:''}</div>`;
  tip.style.display='block';
  tip.style.left='0px'; tip.style.top='0px';   // 実寸計測のため一旦リセット
  // カーソル近傍に、キャンバス領域からはみ出さないよう配置
  const area=document.getElementById('canvasArea').getBoundingClientRect();
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  const cx=ev.clientX-area.left, cy=ev.clientY-area.top;
  let x=cx+16, y=cy+14;
  if(x+tw>area.width-8)  x=cx-tw-16;          // 右に入らなければ左へ反転
  if(x<8)                x=Math.max(8,Math.min(cx+16,area.width-tw-8));
  if(y+th>area.height-8) y=cy-th-14;          // 下に入らなければ上へ反転
  if(y<8)                y=Math.max(8,area.height-th-8);
  tip.style.left=Math.round(x)+'px'; tip.style.top=Math.round(y)+'px';
}
function hideDevTip(){ const t=document.getElementById('devTip'); if(t) t.style.display='none'; }

function attachPhysicalEvents(){
  const svg=document.getElementById('physSvg');
  if(!svg) return;
  // ホバーで詳細表示（ドラッグ中は出さない）
  svg.addEventListener('mousemove',e=>{
    if(drag||cbDrag||dgDrag){ hideDevTip(); return; }
    const g=e.target.closest('.dev-g');
    if(g) showDevTip(g.dataset.dev,e); else hideDevTip();
  });
  svg.addEventListener('mouseleave',hideDevTip);
  svg.addEventListener('mousedown',e=>{
    // ポートからドラッグして配線（離した先のポートに接続）。動かさず離せばクリック接続。
    const port=e.target.closest('.port-c');
    if(port){
      const pt=svgPt(svg,e);
      portDrag={deviceId:port.dataset.dev,ifId:port.dataset.if,
        x0:pt.x,y0:pt.y,x:pt.x,y:pt.y,moved:false,
        used:isPortUsed(port.dataset.dev,port.dataset.if)};
      hideDevTip();
      e.preventDefault(); e.stopPropagation();
      return;
    }
    const g=e.target.closest('.dev-g');
    if(g){
      const id=g.dataset.dev;
      selectedDev=id; editIfIdx=null; renderProps();
      if(explainMode) explainDevice(id);
      const dev=project.devices.find(d=>d.id===id);
      const pt=svgPt(svg,e);
      drag={id,dx:pt.x-dev.x,dy:pt.y-dev.y,moved:false};
      renderPhysical();
      e.preventDefault();
    }
  });
  svg.addEventListener('click',e=>{
    // 配線をクリックで選択（Delete / ✕ で削除）
    const cab=e.target.closest('path[data-cable]');
    if(cab&&!cbDrag?.moved){
      selectedLink=(selectedLink===cab.dataset.cable)?null:cab.dataset.cable;
      renderPhysical(); return;
    }
    if(e.target.dataset.bg&&!lastPanMoved&&!drag){
      selectedDev=null; editIfIdx=null; selectedLink=null; linkFirst=null;
      renderProps(); renderPhysical();
    }
  });
  // 配線削除ボタン（選択中の配線の中点に表示）
  svg.addEventListener('mousedown',e=>{
    const del=e.target.closest('[data-delcable]');
    if(del){ selectedLink=del.dataset.delcable; deleteSelectedLink(); e.stopPropagation(); }
  },true);
  // ポートからのドラッグ配線: ラバーバンド表示
  svg.addEventListener('mousemove',e=>{
    if(!portDrag) return;
    const pt=svgPt(svg,e);
    portDrag.x=pt.x; portDrag.y=pt.y;
    if(Math.hypot(pt.x-portDrag.x0,pt.y-portDrag.y0)>4) portDrag.moved=true;
    let rb=svg.querySelector('#rubber');
    if(!rb){
      const NS='http://www.w3.org/2000/svg';
      rb=document.createElementNS(NS,'path');
      rb.setAttribute('id','rubber'); rb.setAttribute('fill','none');
      rb.setAttribute('stroke',portDrag.used?'#EF4444':'#F59E0B');
      rb.setAttribute('stroke-width','2.4'); rb.setAttribute('stroke-dasharray','6,4');
      rb.setAttribute('pointer-events','none');
      svg.appendChild(rb);
    }
    rb.setAttribute('d',`M${portDrag.x0},${portDrag.y0} L${pt.x},${pt.y}`);
    // 接続可能なポートの上ではハイライト
    const over=e.target.closest('.port-c');
    const ok=over&&!isPortUsed(over.dataset.dev,over.dataset.if)
      &&over.dataset.dev!==portDrag.deviceId&&!portDrag.used;
    rb.setAttribute('stroke',ok?'#16A34A':(portDrag.used?'#EF4444':'#F59E0B'));
  });
  // hover: highlight both endpoint ports + labels
  let hlEls=[];
  const clearHl=()=>{ for(const el of hlEls){ if(el._restore) el._restore(); else el.remove(); } hlEls=[]; };
  svg.addEventListener('mouseover',e=>{
    const pathEl=e.target.closest('path[data-cable]');
    if(!pathEl||drag||cbDrag) return;
    clearHl();
    const l=(project.links||[]).find(k=>k.id===pathEl.dataset.cable);
    if(!l) return;
    for(const end of [l.a,l.b]){
      const c=svg.querySelector(`circle[data-dev="${CSS.escape(end.deviceId)}"][data-if="${CSS.escape(end.ifId)}"]`);
      if(!c) continue;
      const oldR=c.getAttribute('r');
      c.setAttribute('r','7.5'); c.setAttribute('stroke','#F59E0B'); c.setAttribute('stroke-width','2.5');
      c._restore=()=>{c.setAttribute('r',oldR);c.setAttribute('stroke','white');c.setAttribute('stroke-width','1.5');delete c._restore;};
      hlEls.push(c);
      const dev=project.devices.find(d=>d.id===end.deviceId);
      const iface=(dev?.interfaces||[]).find(i=>i.id===end.ifId);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.textContent=`${dev?.name||''} / ${iface?.name||end.ifId}`;
      t.setAttribute('x',+c.getAttribute('cx')+9);
      t.setAttribute('y',+c.getAttribute('cy')-9);
      t.setAttribute('font-size','10'); t.setAttribute('font-weight','700');
      t.setAttribute('fill','#B45309'); t.setAttribute('stroke','white');
      t.setAttribute('stroke-width','3'); t.setAttribute('paint-order','stroke');
      t.setAttribute('pointer-events','none');
      svg.appendChild(t); hlEls.push(t);
    }
  });
  svg.addEventListener('mouseout',e=>{
    if(e.target.closest&&e.target.closest('path[data-cable]')) clearHl();
  });
  // ドラッグ中はグリッドスナップせず、rAF で1フレーム1回だけ再描画（追従をなめらかに）
  svg.addEventListener('mousemove',e=>{
    if(!drag) return;
    const pt=svgPt(svg,e);
    drag.pend={x:Math.max(0,pt.x-drag.dx), y:Math.max(0,pt.y-drag.dy)};
    drag.moved=true;
    if(_devRaf) return;
    _devRaf=requestAnimationFrame(()=>{
      _devRaf=0;
      if(!drag||!drag.pend) return;
      const dev=project.devices.find(d=>d.id===drag.id);
      if(!dev) return;
      dev.x=drag.pend.x; dev.y=drag.pend.y;
      renderPhysical();
    });
  });
}

function svgPt(svg,e){
  const r=svg.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom};
}
// ── ポート使用状況 ──
function isPortUsed(devId,ifId){
  return (project.links||[]).some(l=>
    (l.a.deviceId===devId&&l.a.ifId===ifId)||(l.b.deviceId===devId&&l.b.ifId===ifId));
}
function linkOfPort(devId,ifId){
  return (project.links||[]).find(l=>
    (l.a.deviceId===devId&&l.a.ifId===ifId)||(l.b.deviceId===devId&&l.b.ifId===ifId));
}
// ── 2つのポートを接続（使用済み・同一機器はブロック） ──
function connectPorts(a,b){
  if(a.deviceId===b.deviceId&&a.ifId===b.ifId) return false;
  if(a.deviceId===b.deviceId){ addLog('WARNING','同じ機器のポート同士は接続できません'); return false; }
  for(const e of [a,b]) if(isPortUsed(e.deviceId,e.ifId)){
    const d=project.devices.find(x=>x.id===e.deviceId);
    const i=(d?.interfaces||[]).find(x=>x.id===e.ifId);
    addLog('WARNING',`${d?.name||e.deviceId} / ${i?.name||e.ifId} は既に接続済みです`);
    return false;
  }
  const newLink={id:'k'+Date.now().toString(36),a:{...a},b:{...b},type:'wired',speed:'1G'};
  project.links.push(newLink);
  const da=project.devices.find(x=>x.id===a.deviceId), db=project.devices.find(x=>x.id===b.deviceId);
  const ia=(da?.interfaces||[]).find(x=>x.id===a.ifId), ib=(db?.interfaces||[]).find(x=>x.id===b.ifId);
  addLog('SUCCESS',`接続: ${da?.name}/${ia?.name} ↔ ${db?.name}/${ib?.name}`);
  autoAssignIp(newLink);
  commit(); renderAll();
  return true;
}
// クリック2回での接続（1回目=起点、2回目=終点）
function handlePortClick(devId,ifId){
  if(isPortUsed(devId,ifId)){
    const d=project.devices.find(x=>x.id===devId);
    const i=(d?.interfaces||[]).find(x=>x.id===ifId);
    addLog('WARNING',`${d?.name} / ${i?.name} は既に接続済みです（配線を選択して Delete で削除できます）`);
    linkFirst=null; renderPhysical(); return;
  }
  if(!linkFirst){
    linkFirst={deviceId:devId,ifId};
    const d=project.devices.find(x=>x.id===devId);
    const i=(d?.interfaces||[]).find(x=>x.id===ifId);
    addLog('INFO',`接続元: ${d?.name} / ${i?.name} — 接続先ポートをクリック（Escで取消）`);
    renderPhysical(); return;
  }
  if(linkFirst.deviceId===devId&&linkFirst.ifId===ifId){ linkFirst=null; renderPhysical(); return; }
  const from={...linkFirst}; linkFirst=null;
  if(!connectPorts(from,{deviceId:devId,ifId})) renderPhysical();
}
// ── 配線の削除 ──
function deleteSelectedLink(){
  if(!selectedLink) return;
  const l=(project.links||[]).find(x=>x.id===selectedLink);
  if(!l){ selectedLink=null; return; }
  const da=project.devices.find(x=>x.id===l.a.deviceId), db=project.devices.find(x=>x.id===l.b.deviceId);
  project.links=project.links.filter(x=>x.id!==selectedLink);
  if(project.linkRoute) for(const v in project.linkRoute) delete project.linkRoute[v][selectedLink];
  selectedLink=null;
  addLog('INFO',`配線を削除: ${da?.name||'?'} ↔ ${db?.name||'?'}`);
  commit(); renderAll();
}

// ── 接続時のIP自動入力（未設定時のみ・上書きしない） ──
function nextFreeIp(cidr){
  const [na,pfxs]=cidr.split('/'); const pfx=+pfxs;
  if(pfx>30) return null;
  const base=ip2int(na);
  const size=Math.pow(2,32-pfx);
  const used=new Set();
  for(const d of project.devices) for(const i of d.interfaces||[])
    if(i.ip&&inNet(i.ip,cidr)) used.add(ip2int(i.ip));
  const fmt=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255].join('.');
  const start=Math.min(10,size-2);
  for(let o=start;o<size-1;o++) if(!used.has(base+o)) return fmt(base+o);
  for(let o=2;o<start;o++)      if(!used.has(base+o)) return fmt(base+o);
  return null;
}
function autoAssignIp(link){
  const G=buildGraph(project);
  const AUTO_TYPES=['pc','laptop','printer','server','nas','ap'];
  for(const [self,peer] of [[link.a,link.b],[link.b,link.a]]){
    const dev=G.devMap[self.deviceId]; if(!dev) continue;
    if(!AUTO_TYPES.includes(dev.type)) continue;
    const iface=G.ifOf(self.deviceId,self.ifId);
    if(!iface||iface.ip) continue;               // 既存値は上書きしない
    const pi=G.ifOf(peer.deviceId,peer.ifId);
    if(!pi) continue;
    let cidr=null, gw=null, vlan=pi.vlanId??null;
    if(pi.ip&&pi.prefix!=null){ cidr=netOf(pi.ip,+pi.prefix); gw=pi.ip; }   // ルーター等に直結
    else if(pi.vlanId!=null){                                                // アクセスポート → SVIのセグメント
      outer:
      for(const dd of project.devices) for(const ii of dd.interfaces||[]){
        if(ii.role==='svi'&&ii.vlanId===pi.vlanId&&ii.ip&&ii.prefix!=null){
          cidr=netOf(ii.ip,+ii.prefix); gw=ii.ip; break outer;
        }
      }
    }
    if(!cidr){ addLog('INFO',`IP自動設定スキップ: ${dev.name}/${iface.name} — 接続先セグメントを特定できません`); continue; }
    const ip=nextFreeIp(cidr);
    if(!ip){ addLog('WARNING',`IP自動設定失敗: ${cidr} に空きがありません`); continue; }
    const pfx=+cidr.split('/')[1];
    iface.ip=ip; iface.prefix=pfx;
    if(gw&&!iface.gateway) iface.gateway=gw;
    if(vlan!=null&&iface.vlanId==null) iface.vlanId=vlan;
    addLog('SUCCESS',`IP自動設定: ${dev.name}/${iface.name}`,
      [`IP:      ${ip}/${pfx}  (セグメント ${cidr})`,
       gw?`Gateway: ${gw}`:null,
       vlan!=null?`VLAN:    ${vlan}`:null].filter(Boolean));
  }
}
